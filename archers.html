<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>تیراندازها</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--gold:#ffc94a;--ink:#10203a}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0c1830;color:#fff;font-family:Tahoma,Arial,sans-serif;user-select:none;touch-action:none}
#app{position:fixed;top:0;left:0;width:100%;height:100%;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;font-size:15px;padding:9px 14px;border:1px solid rgba(255,255,255,.22);border-radius:14px;background:rgba(255,255,255,.13);color:#fff}
button:active{transform:scale(.96)}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.18),rgba(12,24,52,.7));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,201,74,.4);box-shadow:0 10px 34px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.25)}
#burger{position:absolute;top:6px;left:6px;width:38px;height:38px;padding:0;font-size:18px;border-radius:50%;z-index:3}
.ov{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 20%,rgba(40,90,170,.55),rgba(5,10,28,.93));overflow:auto;animation:fd .25s}
@keyframes fd{from{opacity:0}}
.box{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;padding:14px 16px;margin:8px;border-radius:24px;width:min(560px,96%)}
.box h2{margin:0;font-size:28px;background:linear-gradient(180deg,#fff,#ffd66e 55%,#e08a1e);-webkit-background-clip:text;background-clip:text;color:transparent}
.row{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.row button.on{background:linear-gradient(180deg,#ffe08a,#e8a32a);color:#2b1c04;font-weight:bold;border-color:#fff1c2}
.gb{font-size:18px;font-weight:bold;padding:11px 34px;border-radius:18px;color:#2b1c04;background:linear-gradient(180deg,#ffe596,#f2b032 55%,#d6851a);border:1px solid #fff3cc;box-shadow:0 8px 20px rgba(0,0,0,.45)}
.sm{font-size:13px;opacity:.85}
.info{font-size:14px;color:#ffe6a8}
#panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;border-radius:22px;padding:16px 22px;display:flex;flex-direction:column;gap:9px;text-align:center;min-width:250px}
#shop .box{width:min(620px,98%);max-height:94%;overflow:auto;align-items:stretch}
.srow{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border-radius:14px;padding:7px 10px;text-align:right}
.srow .ic{font-size:26px;width:34px;text-align:center}
.srow .tx{flex:1;font-size:13px;line-height:1.5}
.srow .tx b{font-size:15px}
.srow button{padding:7px 10px;font-size:13px;min-width:88px}
.srow button:disabled{opacity:.4}
.bar{height:6px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd66e,#ff9a2a)}
h3{margin:6px 0 0;font-size:15px;color:#ffd66e;text-align:center}
</style>
</head>
<body>
<div id="app">
<canvas id="c"></canvas>
<button id="burger" class="glass" hidden>⏸</button>
<div id="setup" class="ov"><div class="box glass">
  <h2>🏹 تیراندازها</h2>
  <div class="info" id="stat"></div>
  <div class="row" id="modes"><button data-m="adv" class="on">🏹 ماجراجویی (موج‌ها)</button><button data-m="duel">⚔ دوئل با کامپیوتر</button><button data-m="two">👥 دو نفره (یک گوشی)</button></div>
  <div id="lvlw" hidden><div class="row" id="lvls"><button data-l="0">آسان</button><button data-l="1" class="on">متوسط</button><button data-l="2">سخت</button></div></div>
  <div class="sm" id="how">بکش عقب، هدف بگیر و رها کن. تیر به سر ضربه‌ی دوبرابر می‌زنه!</div>
  <button id="go" class="gb">شروع</button>
  <div class="row"><button id="shopBtn">🛒 فروشگاه</button><button id="rot2" class="sm">🔄 صفحه برعکسه؟</button><button id="lb1" class="sm">🎮 لیست بازی‌ها</button></div>
</div></div>
<div id="shop" class="ov" hidden><div class="box glass"><h2>🛒 فروشگاه</h2><div class="info" id="sc">0</div><div id="slist"></div><button id="shopClose" class="gb">ادامه ▶</button></div></div>
<div id="wave" class="ov" hidden style="background:rgba(5,10,28,.55)"><div class="box glass" style="width:min(380px,92%)"><h2 id="wt">موج ۱ تموم شد!</h2><div id="wx" class="info"></div><button id="nextW" class="gb">موج بعدی ▶</button><button id="wshop">🛒 فروشگاه</button></div></div>
<div id="over" class="ov" hidden><div class="box glass" style="width:min(380px,92%)"><h2 id="ot">🏆</h2><div id="ox" class="info"></div><button id="again" class="gb">↻ دوباره</button><button id="home1">🏠 منوی اصلی</button></div></div>
<div id="menu" class="ov" hidden><div class="box glass" style="width:min(340px,92%)"><h2>⏸ مکث</h2><button id="resume" class="gb">▶ ادامه</button><button id="mute">🔊 صدا</button><button id="rot3">🔄 برعکس کردن صفحه</button><button id="home2">🏠 منوی اصلی</button><button id="lb3" class="sm">🎮 لیست بازی‌ها</button></div></div>
</div>
<script>
const tg=window.Telegram&&window.Telegram.WebApp;
if(tg){try{tg.ready();tg.expand();if(tg.disableVerticalSwipes)tg.disableVerticalSwipes();}catch(e){}}
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const W=800,H=450,GY=380,G=900;
const FA=['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'],fa=n=>String(Math.round(n)).replace(/\d/g,d=>FA[d]);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0];
let AW=800,AH=450,S=1,OX=0,OY=0,rot=1;
try{rot=localStorage.getItem('rotDir')==='-1'?-1:1;}catch(e){}

/* ---------- screen fit (landscape; rotated when the phone is upright) ---------- */
function fit(){
  const w=innerWidth,h=innerHeight,a=$('app').style,d=Math.min(2,devicePixelRatio||1);
  if(h>w){AW=h;AH=w;a.cssText=rot===1?`left:${w}px;top:0;width:${h}px;height:${w}px;transform-origin:0 0;transform:rotate(90deg)`:`left:0;top:${h}px;width:${h}px;height:${w}px;transform-origin:0 0;transform:rotate(-90deg)`;}
  else{AW=w;AH=h;a.cssText='left:0;top:0;width:100%;height:100%';}
  cv.width=AW*d;cv.height=AH*d;S=Math.min(AW/W,AH/H);OX=(AW-W*S)/2;OY=(AH-H*S)/2;BG=null;
}
function flipScreen(){rot=-rot;try{localStorage.setItem('rotDir',rot);}catch(e){}fit();}
addEventListener('resize',fit);
function toWorld(e){const w=innerWidth,h=innerHeight;let lx=e.clientX,ly=e.clientY;
  if(h>w){if(rot===1){lx=e.clientY;ly=w-e.clientX;}else{lx=h-e.clientY;ly=e.clientX;}}
  return[(lx-OX)/S,(ly-OY)/S];}

/* ---------- sound (synthesised) ---------- */
let AC=null,muted=false;try{muted=localStorage.getItem('nardMute')==='1';}catch(e){}
function ac(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C();}if(AC&&AC.state==='suspended')AC.resume();}catch(e){}return AC;}
function tone(f0,f1,dur,vol,type,t0){const a=AC,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f0,t0);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t0+dur);g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+.006);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+dur+.03);}
function nz(t0,dur,vol,f0,f1,type){const a=AC,n=Math.max(8,Math.floor(a.sampleRate*dur)),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,1.5);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type=type||'bandpass';f.frequency.setValueAtTime(f0,t0);if(f1)f.frequency.exponentialRampToValueAtTime(f1,t0+dur);f.Q.value=1.2;const g=a.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(a.destination);s.start(t0);}
function snd(k){try{if(muted||!ac())return;const t=AC.currentTime;
  if(k==='shoot'){tone(260,90,.12,.35,'triangle',t);nz(t,.1,.35,1800,500);}
  else if(k==='whoosh')nz(t,.22,.12,900,2400);
  else if(k==='hit'){tone(150,70,.1,.5,'sine',t);nz(t,.05,.4,1200,600);}
  else if(k==='head'){tone(150,70,.1,.5,'sine',t);tone(1320,1320,.18,.3,'triangle',t+.02);tone(1760,1760,.22,.2,'triangle',t+.08);}
  else if(k==='block'){tone(900,500,.08,.3,'square',t);nz(t,.04,.3,3000,1500);}
  else if(k==='boom'){nz(t,.6,.7,700,60,'lowpass');tone(90,35,.5,.6,'sine',t);}
  else if(k==='coin'){tone(1200,1200,.07,.2,'triangle',t);tone(1800,1800,.12,.2,'triangle',t+.06);}
  else if(k==='hurt'){tone(220,90,.22,.4,'sawtooth',t);}
  else if(k==='freeze'){nz(t,.3,.25,4000,1500,'highpass');tone(1500,600,.25,.15,'sine',t);}
  else if(k==='zap'){nz(t,.18,.4,3500,800);tone(700,200,.16,.25,'sawtooth',t);}
  else if(k==='meteor'){nz(t,.5,.4,2500,200);}
  else if(k==='wave')[392,523,659].forEach((f,i)=>tone(f,f,.2,.22,'triangle',t+i*.1));
  else if(k==='boss'){tone(110,70,.8,.5,'sawtooth',t);tone(82,55,.9,.4,'square',t);}
  else if(k==='win')[523,659,784,1047,1319].forEach((f,i)=>tone(f,f,.28,.25,'triangle',t+i*.1));
  else if(k==='lose')[392,349,311,262].forEach((f,i)=>tone(f,f*.97,.35,.2,'triangle',t+i*.16));
  else if(k==='click')tone(800,600,.05,.18,'square',t);
 }catch(e){}}
addEventListener('pointerdown',()=>ac());

/* ---------- save / upgrades / arrows ---------- */
const SAVE0={coins:0,up:[0,0,0,0],ammo:Array(12).fill(0),best:0};
function load(){try{const o=JSON.parse(localStorage.getItem('archSave'));if(o&&o.up)return Object.assign({},SAVE0,o,{ammo:(o.ammo||[]).concat(Array(12).fill(0)).slice(0,12)});}catch(e){}return JSON.parse(JSON.stringify(SAVE0));}
let save=load();
function persist(){try{localStorage.setItem('archSave',JSON.stringify(save));}catch(e){}}
const UP=[{n:'قدرت تیر',ic:'💥',c:30,d:'+۱۲٪ آسیب'},{n:'قدرت کمان',ic:'💪',c:30,d:'+۵٪ سرعت و برد تیر'},{n:'جان',ic:'❤️',c:25,d:'+۲۰ جان'},{n:'زره',ic:'🛡️',c:35,d:'−۴٪ آسیب دریافتی'}];
const MAXUP=10,upCost=i=>Math.round(UP[i].c*Math.pow(save.up[i]+1,1.45));
const dmgMul=()=>mode==='adv'?1+.12*save.up[0]:1,powMul=()=>mode==='adv'?1+.05*save.up[1]:1,maxHP=()=>mode==='adv'?100+20*save.up[2]:100,armor=()=>mode==='adv'?Math.min(.6,.04*save.up[3]):0;
const AR=[
 {n:'معمولی',ic:'🏹',col:'#f1e4bf',p:0,m:1,d:'نامحدود'},
 {n:'آتشین',ic:'🔥',col:'#ff7a2a',p:60,m:1.1,fx:'fire',d:'می‌سوزونه'},
 {n:'برقی',ic:'⚡',col:'#ffe94a',p:70,m:1,fx:'elec',d:'به دشمن بغلی می‌پره'},
 {n:'سمی',ic:'☠️',col:'#7be04a',p:60,m:.9,fx:'pois',d:'مسموم و کند می‌کنه'},
 {n:'موشکی',ic:'🚀',col:'#ff5a5a',p:90,m:1.3,fx:'boom',rad:70,g:.5,sp:1.15,d:'انفجار'},
 {n:'یخی',ic:'❄️',col:'#7fdcff',p:70,m:.8,fx:'ice',d:'یخ می‌زنه'},
 {n:'شهاب‌سنگ',ic:'☄️',col:'#ff9a3a',p:110,m:1,fx:'meteor',d:'بارش شهاب‌سنگ'},
 {n:'سه‌تایی',ic:'🔱',col:'#c9a8ff',p:80,m:.7,fx:'tri',d:'سه تیر همزمان'},
 {n:'سنگین',ic:'🪨',col:'#a3adc2',p:60,m:2.1,sp:.85,d:'آسیب دوبرابر'},
 {n:'خون‌آشام',ic:'🩸',col:'#ff4d6d',p:90,m:1,fx:'vamp',d:'جان می‌دزده'},
 {n:'لیزری',ic:'🎯',col:'#5cf2ff',p:80,m:1.15,g:.12,sp:1.3,d:'تقریباً مستقیم'},
 {n:'بمب',ic:'💣',col:'#5a5f70',p:130,m:1.2,fx:'boom',rad:115,sp:.8,d:'انفجار بزرگ'},
];

/* ---------- state ---------- */
let mode='adv',state='menu',lvl=1,wave=0,archers=[],arrows=[],parts=[],texts=[],blocks=[],timers=[],sel=0,wind=0,round=[0,0],time=0,shake=0,toast='',toastT=0,runCoins=0,hint=0,clearT=0,endT=0,hold=false,BG=null;
const touches={};

/* ---------- archers ---------- */
function mkArcher(team,x,fy,o){return Object.assign({team,x,fy,face:team===0?1:-1,hp:100,max:100,cd:0,aim:null,charge:0,flash:0,burn:0,pois:0,freeze:0,stun:0,helm:0,shield:0,tri:0,dead:0,ai:null,bob:Math.random()*6,aimAng:team===0?-.4:Math.PI+.4,pull:0,boss:0,dmgBase:20},o||{});}
const sc=a=>a.boss?1.45:1;
function startAdv(){mode='adv';wave=0;runCoins=0;sel=0;arrows=[];parts=[];texts=[];timers=[];
  const p=mkArcher(0,95,GY-40,{hp:maxHP(),max:maxHP(),isP:1,dmgBase:20*dmgMul()});archers=[p];nextWave();$('burger').hidden=false;state='play';hint=7;}
function nextWave(){
  wave++;arrows=[];timers=[];const p=archers[0];p.hp=Math.min(p.max,p.hp+25);archers=[p];blocks=[{x:55,y:GY-40,w:80,h:40}];
  const boss=wave%5===0,cnt=boss?(wave>=10?2:1):Math.min(3,1+((wave-1)/3|0));
  for(let i=0;i<cnt;i++){
    const fy=GY-pick([0,0,40,70]),x=520+i*100+rnd(-20,20),isB=boss&&i===0;
    const hp=isB?260+wave*35:36+wave*9;
    const e=mkArcher(1,x,fy,{hp,max:hp,boss:isB?1:0,dmgBase:(isB?22:15)*(1+wave*.02)});
    e.ai={t:rnd(1.5,3.2),err:clamp(.11-wave*.006,.018,.11),vErr:clamp(.07-wave*.003,.015,.07),base:clamp(4.4-wave*.13,1.9,4.4)*(isB?.8:1),v:rnd(560,700)+Math.min(wave*6,120),type:isB?1:0,tri:isB};
    archers.push(e);blocks.push({x:x-34,y:fy,w:68,h:GY-fy});
  }
  say(boss?'👹 غول!':'موج '+fa(wave),2);snd(boss?'boss':'wave');
}
function startDuel(vsAI){mode=vsAI?'duel':'two';round=[0,0];sel=0;runCoins=0;$('burger').hidden=false;newRound();}
function newRound(){
  arrows=[];parts=[];texts=[];timers=[];blocks=[{x:55,y:GY-40,w:80,h:40},{x:665,y:GY-40,w:80,h:40}];
  wind=Math.round(rnd(-110,110));
  const a=mkArcher(0,95,GY-40,{isP:1}),b=mkArcher(1,705,GY-40,{isP:mode==='two'?1:0});
  if(mode==='duel'){const L=[{err:.09,vErr:.06,base:2.8},{err:.05,vErr:.035,base:2.0},{err:.022,vErr:.015,base:1.5}][lvl];b.ai=Object.assign({t:rnd(1.5,2.5),v:rnd(620,720),type:0},L);}
  archers=[a,b];state='play';say('دور '+fa(round[0]+round[1]+1),2);snd('wave');
}
function say(t,s){toast=t;toastT=s;}

/* ---------- ballistics / AI ---------- */
function solve(sx,sy,tx,ty,v,g,high){
  const dx=Math.abs(tx-sx)||1,Y=sy-ty,d=v*v*v*v-g*(g*dx*dx+2*Y*v*v);
  if(d<0)return null;
  return Math.atan((v*v+(high?1:-1)*Math.sqrt(d))/(g*dx));
}
function aiTick(a,dt){
  const A=a.ai,tg=archers.find(t=>t.team!==a.team&&t.hp>0);if(!tg)return;
  if(a.charge>0){a.charge-=dt;a.aim={ang:A.ang,pw:.9};a.aimAng=A.ang;
    if(a.charge<=0){a.aim=null;
      const spread=A.tri?[-.07,0,.07]:[0];spread.forEach(o=>rawShoot(a,A.ang+o,A.vv,A.type,A.tri?.8:1,true));A.t=A.base*rnd(.75,1.25);}
    return;}
  A.t-=dt*(a.pois>0?.6:1);
  if(A.t<=0){
    const v=A.v*(1+rnd(-A.vErr,A.vErr)),sx=a.x+a.face*12,sy=a.fy-48*sc(a);
    let th=solve(sx,sy,tg.x+(mode==='duel'?-wind*.06*a.face*-1:0),tg.fy-30,v,G,Math.random()<.3);if(th===null)th=solve(sx,sy,tg.x,tg.fy-30,v,G,false);
    if(th===null){A.t=.4;return;}
    th+=rnd(-A.err,A.err);A.ang=a.face===1?-th:Math.PI+th;A.vv=v;a.charge=.55;
  }
}

/* ---------- shooting ---------- */
function rawShoot(a,ang,v,ti,m,quiet){
  const T=AR[ti],bx=a.x+a.face*12*sc(a),by=a.fy-48*sc(a);
  const mk=(an,mm)=>arrows.push({x:bx,y:by,vx:Math.cos(an)*v*(T.sp||1),vy:Math.sin(an)*v*(T.sp||1),g:T.g==null?1:T.g,team:a.team,ti,dmg:a.dmgBase*T.m*mm*(m||1),col:T.col,owner:a,t:0,trail:[],fx:T.fx});
  if(T.fx==='tri'||a.tri>0){[-.09,0,.09].forEach(o=>mk(ang+o,.7));if(a.tri>0&&ti!==7)a.tri--;}else mk(ang,1);
  a.pull=1;snd('shoot');
}
function playerRelease(a,pw,ang){
  if(a.cd>0||a.freeze>0||a.stun>0||a.hp<=0)return;
  const ti=(mode==='adv'&&sel>0&&save.ammo[sel]>0)?sel:0;
  rawShoot(a,ang,(300+600*pw)*powMul(),ti);
  if(ti>0){save.ammo[ti]--;if(save.ammo[ti]<=0)sel=0;persist();}
  a.cd=mode==='adv'?.45:.8;
}

/* ---------- hits / damage ---------- */
function hitPart(t,x,y){const s=sc(t);
  if(Math.hypot(x-t.x,y-(t.fy-62*s))<11*s)return'head';
  if(Math.abs(x-t.x)<10*s&&y>t.fy-54*s&&y<t.fy)return'body';return null;}
function txt(x,y,s,c,z){texts.push({x,y,t:0,s,c:c||'#fff',z:z||18});}
function spark(x,y,c,n,v,g){for(let i=0;i<n;i++){const a=Math.random()*7,s=Math.random()*v;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-v*.2,l:.4+Math.random()*.5,c,r:2+Math.random()*2.5,g:g==null?300:g});}}
function earn(n){if(mode!=='adv')return;save.coins+=n;runCoins+=n;}
function hurt(t,d,part,from,quiet){
  if(t.hp<=0)return 0;
  if(part==='head'&&t.helm>0){t.helm--;txt(t.x,t.fy-90,'🪖 بلاک','#ffe08a');snd('block');return 0;}
  if(t.shield>0){t.shield--;txt(t.x,t.fy-90,'🛡️','#9fe8ff');snd('block');spark(t.x,t.fy-40,'#9fe8ff',8,160);return 0;}
  if(t.isP&&t.team===0)d*=1-armor();
  t.hp-=d;t.flash=.14;
  txt(t.x+rnd(-8,8),t.fy-82*sc(t),fa(d),part==='head'?'#ffd24a':'#fff',part==='head'?24:18);
  if(t.isP&&t.team===0){snd('hurt');shake=Math.max(shake,.25);}else snd(part==='head'?'head':'hit');
  if(!quiet&&from&&from.isP&&from.team===0){earn(part==='head'?6:3);}
  if(t.hp<=0){t.hp=0;t.dead=.001;onDeath(t,from,part);}
  return d;
}
function onDeath(t,from,part){
  spark(t.x,t.fy-40,t.team?'#e0344d':'#3a7bff',16,240);
  if(mode==='adv'&&t.team===1){earn(12+(part==='head'?10:0)+(t.boss?60:0));snd('coin');

  ctx.restore();
  ctx.save();const sh2=shake*10;ctx.translate(OX+(Math.random()-.5)*sh2,OY+(Math.random()-.5)*sh2);ctx.scale(S,S);
  clouds.forEach(c=>{c.x=(c.x+.12*c.s)%(W+160);ctx.fillStyle='rgba(255,255,255,.75)';[[0,0,26],[24,-8,20],[-24,-4,18],[44,2,16]].forEach(([x,y,r])=>{ctx.beginPath();ctx.arc(c.x-80+x*c.s,c.y+y*c.s,r*c.s,0,7);ctx.fill();});});
  drawBlocks();
  archers.forEach(a=>{if(a.hp>0||a.dead<1.4)drawArcher(a);});
  archers.forEach(a=>{if(a.aim&&a.hp>0&&a.isP&&a.team===0||a.aim&&mode==='two'&&a.isP)drawPreview(a,a.aim);});
  arrows.forEach(drawArrow);
  parts.forEach(p=>{ctx.globalAlpha=clamp(p.l*2,0,1);if(p.ring){ctx.strokeStyle=p.c;ctx.lineWidth=4;ctx.beginPath();ctx.arc(p.x,p.y,p.r*(1.6-p.l*2.2),0,7);ctx.stroke();}else{ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();}});ctx.globalAlpha=1;
  texts.forEach(t=>{ctx.globalAlpha=1-t.t;T(t.s,t.x,t.y,t.z,t.c);});ctx.globalAlpha=1;
  if(state==='play'||state==='ending'||state==='clear')drawHUD();
  ctx.restore();
}
let last=0;
function frame(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;if(!hold&&state!=='pause'&&state!=='menu')update(dt);render();requestAnimationFrame(frame);}

/* ---------- ui ---------- */
function stat(){$('stat').innerHTML='🪙 '+fa(save.coins)+' &nbsp;|&nbsp; 🏆 بهترین موج: '+fa(save.best);}
function showMenu(){state='menu';$('burger').hidden=true;['over','wave','shop','menu'].forEach(i=>$(i).hidden=true);$('setup').hidden=false;stat();}
let selM='adv';
$('modes').onclick=e=>{const m=e.target.dataset.m;if(!m)return;selM=m;[...$('modes').children].forEach(b=>b.classList.toggle('on',b.dataset.m===m));$('lvlw').hidden=m!=='duel';
  $('how').textContent=m==='adv'?'بکش عقب، هدف بگیر و رها کن. تیر به سر ضربه‌ی دوبرابر می‌زنه!':m==='duel'?'دوئل: هر کی زودتر ۲ دور ببره برنده است. باد روی تیر اثر می‌ذاره.':'هر نفر نیمه‌ی خودش از صفحه رو بکشه. اولین نفری که ۲ دور ببره برنده است.';};
$('lvls').onclick=e=>{const l=e.target.dataset.l;if(l===undefined)return;lvl=+l;[...$('lvls').children].forEach(b=>b.classList.toggle('on',+b.dataset.l===lvl));};
$('go').onclick=()=>{ac();$('setup').hidden=true;if(selM==='adv')startAdv();else startDuel(selM==='duel');};
$('again').onclick=()=>{$('over').hidden=true;if(mode==='adv')startAdv();else startDuel(mode==='duel');};
$('nextW').onclick=()=>{$('wave').hidden=true;nextWave();state='play';};
$('wshop').onclick=()=>{$('wave').hidden=true;openShop('wave');};
$('shopBtn').onclick=()=>openShop('menu');
let shopFrom='menu';
function openShop(from){shopFrom=from;renderShop();$('shop').hidden=false;if(from==='menu')$('setup').hidden=true;}
$('shopClose').onclick=()=>{$('shop').hidden=true;if(shopFrom==='wave')$('wave').hidden=false;else{$('setup').hidden=false;stat();}};
function renderShop(){
  $('sc').textContent='🪙 '+fa(save.coins);
  let h='<h3>ارتقاها</h3>';
  UP.forEach((u,i)=>{const lv=save.up[i],c=upCost(i),mx=lv>=MAXUP;h+=`<div class="srow"><div class="ic">${u.ic}</div><div class="tx"><b>${u.n}</b> — سطح ${fa(lv)}<div class="bar"><i style="width:${lv*10}%"></i></div><span class="sm">${u.d}</span></div><button data-u="${i}" ${mx||save.coins<c?'disabled':''}>${mx?'کامل':'🪙 '+fa(c)}</button></div>`;});
  h+='<h3>تیرهای ویژه (بسته‌ی ۱۰ تایی)</h3>';
  AR.forEach((a,i)=>{if(!i)return;h+=`<div class="srow"><div class="ic">${a.ic}</div><div class="tx"><b>${a.n}</b> — ${fa(save.ammo[i])} تا دارم<br><span class="sm">${a.d}</span></div><button data-a="${i}" ${save.coins<a.p?'disabled':''}>🪙 ${fa(a.p)}</button></div>`;});
  $('slist').innerHTML=h;
}
$('slist').onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
  if(b.dataset.u!==undefined){const i=+b.dataset.u,c=upCost(i);if(save.coins>=c&&save.up[i]<MAXUP){save.coins-=c;save.up[i]++;snd('coin');}}
  else if(b.dataset.a!==undefined){const i=+b.dataset.a;if(save.coins>=AR[i].p){save.coins-=AR[i].p;save.ammo[i]+=10;snd('coin');}}
  persist();renderShop();};
$('burger').onclick=()=>{if(state==='play'){state='pause';$('menu').hidden=false;}};
$('resume').onclick=()=>{$('menu').hidden=true;state='play';};
$('home1').onclick=$('home2').onclick=()=>{Object.keys(touches).forEach(k=>delete touches[k]);showMenu();};
$('lb1').onclick=$('lb3').onclick=()=>{location.href='index.html?back=1';};
$('rot2').onclick=$('rot3').onclick=flipScreen;
function muteLabel(){$('mute').textContent=muted?'🔇 بی‌صدا':'🔊 صدا';}
$('mute').onclick=()=>{muted=!muted;try{localStorage.setItem('nardMute',muted?'1':'0');}catch(e){}muteLabel();};
muteLabel();fit();showMenu();requestAnimationFrame(frame);
</script>
