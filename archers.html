<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>تیراندازها</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#05070f;color:#fff;font-family:Tahoma,Arial,sans-serif;user-select:none;touch-action:none}
#app{position:fixed;top:0;left:0;width:100%;height:100%;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%}
button{font-family:inherit;font-size:15px;padding:9px 14px;border:1px solid rgba(255,255,255,.25);border-radius:12px;background:rgba(255,255,255,.12);color:#fff}
button:active{transform:scale(.95)}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(8,14,32,.78));-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,201,74,.45);box-shadow:0 10px 34px rgba(0,0,0,.55)}
#burger{position:absolute;top:6px;left:6px;width:38px;height:38px;padding:0;border-radius:50%;z-index:3}
#pad{position:absolute;left:12px;bottom:12px;z-index:3;display:flex;gap:10px}
#pad button{width:64px;height:64px;font-size:26px;border-radius:50%;padding:0}
.ov{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 20%,rgba(40,90,170,.5),rgba(4,8,22,.92));overflow:auto}
.box{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;padding:14px 16px;margin:8px;border-radius:22px;width:min(560px,96%)}
.box h2{margin:0;font-size:28px;background:linear-gradient(180deg,#fff,#ffd66e 55%,#e08a1e);-webkit-background-clip:text;background-clip:text;color:transparent}
.gb{font-size:18px;font-weight:bold;padding:11px 34px;border-radius:16px;color:#2b1c04;background:linear-gradient(180deg,#ffe596,#f2b032 55%,#d6851a);border:1px solid #fff3cc}
.row{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.sm{font-size:13px;opacity:.85}.info{font-size:14px;color:#ffe6a8}
#shop .box{width:min(620px,98%);max-height:94%;overflow:auto;align-items:stretch}
.srow{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border-radius:14px;padding:7px 10px;text-align:right;margin-top:6px}
.srow .ic{font-size:26px;width:34px;text-align:center}.srow .tx{flex:1;font-size:13px;line-height:1.5}
.srow button{padding:7px 10px;font-size:13px;min-width:88px}.srow button:disabled{opacity:.4}
.bar{height:6px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd66e,#ff9a2a)}
.row button.on{background:linear-gradient(180deg,#ffe08a,#e8a32a);color:#2b1c04;font-weight:bold}.pl{display:flex;gap:14px;justify-content:center}.pl>div{display:flex;flex-direction:column;gap:6px;align-items:center}.pc{min-width:120px;padding:7px 10px;border-radius:12px;background:rgba(255,255,255,.1);font-size:13px;border:2px solid transparent}.pc.L{border-color:#4b8bff}.pc.R{border-color:#ff6a7a}
h3{margin:6px 0 0;font-size:15px;color:#ffd66e;text-align:center}
</style>
</head>
<body>
<div id="app">
<canvas id="c"></canvas>
<button id="burger" class="glass" hidden>⏸</button>
<div id="pad" hidden style="display:none"><button id="bl" class="glass">◀</button><button id="br" class="glass">▶</button></div>
<div id="setup" class="ov"><div class="box glass">
  <h2>🏹 تیراندازها</h2><div class="info" id="stat"></div>
  <div class="row" id="modes"><button data-m="adv" class="on">🏹 ماجراجویی</button><button data-m="duel">⚔ دوئل با کامپیوتر</button><button data-m="two">👥 دو نفره (یک گوشی)</button><button data-m="team">🌐 آنلاین با دوستان (۲ به ۲)</button></div>
  <div id="lvlw" hidden><div class="row" id="lvls"><button data-l="0">آسان</button><button data-l="1" class="on">متوسط</button><button data-l="2">سخت</button></div></div>
  <div class="sm" id="how"></div>
  <button id="go" class="gb">شروع</button>
  <div class="row"><button id="restart">از مرحله‌ی ۱</button><button id="shopBtn">🛒 فروشگاه</button><button id="rot2" class="sm">🔄 صفحه برعکسه؟</button></div>
</div></div>
<div id="shop" class="ov" hidden><div class="box glass"><h2>🛒 فروشگاه</h2><div class="info" id="sc"></div><div id="slist"></div><button id="shopClose" class="gb">ادامه ▶</button></div></div>
<div id="wave" class="ov" hidden style="background:rgba(5,10,28,.6)"><div class="box glass" style="width:min(380px,92%)"><h2 id="wt"></h2><div id="wx" class="info"></div><button id="nextW" class="gb">مرحله‌ی بعد ▶</button><button id="wshop">🛒 فروشگاه</button></div></div>
<div id="over" class="ov" hidden><div class="box glass" style="width:min(380px,92%)"><h2 id="ot">💀 باختی</h2><div id="ox" class="info"></div><button id="again" class="gb">↻ دوباره</button><button id="home1">🏠 منوی اصلی</button></div></div>
<div id="room" class="ov" hidden><div class="box glass" style="width:min(480px,96%)"><h2>🌐 اتاق آنلاین</h2><div id="rmsg" class="info"></div><div id="rpl" class="pl"></div><div class="row"><button id="share" class="gb" style="font-size:15px;padding:9px 18px">📨 ارسال دعوت‌نامه</button><button id="copy">کپی لینک</button></div><div class="row"><button id="rstart" class="gb" style="font-size:16px;padding:9px 24px">▶ شروع بازی</button><button id="rleave">خروج</button></div></div></div>
<div id="menu" class="ov" hidden><div class="box glass" style="width:min(340px,92%)"><h2>⏸ مکث</h2><button id="resume" class="gb">▶ ادامه</button><button id="mute">🔊 صدا</button><button id="rot3">🔄 برعکس کردن صفحه</button><button id="home2">🏠 منوی اصلی</button></div></div>
</div>
<script>
const tg=window.Telegram&&Telegram.WebApp;if(tg){try{tg.ready();tg.expand();tg.disableVerticalSwipes&&tg.disableVerticalSwipes()}catch(e){}}
const $=i=>document.getElementById(i),cv=$('c'),ctx=cv.getContext('2d');
const W=800,H=450,GY=380,G=900,FA=[...'۰۱۲۳۴۵۶۷۸۹'],fa=n=>String(Math.round(n)).replace(/\d/g,d=>FA[d]);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0];
const hs=i=>Math.abs(Math.sin(i*127.1+311.7)*43758.5453)%1;
let AW=800,AH=450,S=1,OX=0,OY=0,rot=1;
try{rot=localStorage.getItem('rotDir')==='-1'?-1:1}catch(e){}
function fit(){const w=innerWidth,h=innerHeight,a=$('app').style,d=Math.min(2,devicePixelRatio||1);
  if(h>w){AW=h;AH=w;a.cssText=rot===1?`left:${w}px;top:0;width:${h}px;height:${w}px;transform-origin:0 0;transform:rotate(90deg)`:`left:0;top:${h}px;width:${h}px;height:${w}px;transform-origin:0 0;transform:rotate(-90deg)`}
  else{AW=w;AH=h;a.cssText='left:0;top:0;width:100%;height:100%'}
  cv.width=AW*d;cv.height=AH*d;S=Math.min(AW/W,AH/H);OX=(AW-W*S)/2;OY=(AH-H*S)/2}
function flipScreen(){rot=-rot;try{localStorage.setItem('rotDir',rot)}catch(e){}fit()}
addEventListener('resize',fit);
function toView(e){const w=innerWidth,h=innerHeight;let lx=e.clientX,ly=e.clientY;
  if(h>w){if(rot===1){lx=e.clientY;ly=w-e.clientX}else{lx=h-e.clientY;ly=e.clientX}}
  return[(lx-OX)/S,(ly-OY)/S]}

/* sound */
let AC=null,muted=false;try{muted=localStorage.getItem('nardMute')==='1'}catch(e){}
function ac(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}if(AC&&AC.state==='suspended')AC.resume()}catch(e){}return AC}
function tone(f0,f1,d,v,ty,t0){const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f0,t0);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t0+d);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+.006);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d+.03)}
function nz(t0,d,v,f0,f1,ty){const n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/n,1.5);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type=ty||'bandpass';f.frequency.setValueAtTime(f0,t0);f.frequency.exponentialRampToValueAtTime(f1,t0+d);const g=AC.createGain();g.gain.value=v;s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t0)}
function snd(k){if(NET.host)evq.push(['snd',k]);try{if(muted||!ac())return;const t=AC.currentTime;
  if(k==='shoot'){tone(260,90,.12,.3,'triangle',t);nz(t,.1,.3,1800,500)}
  else if(k==='hit'){tone(150,70,.1,.5,'sine',t);nz(t,.05,.4,1200,600)}
  else if(k==='head'){tone(150,70,.1,.5,'sine',t);tone(1320,1320,.18,.3,'triangle',t+.02);tone(1760,1760,.22,.2,'triangle',t+.08)}
  else if(k==='block'){tone(900,500,.08,.3,'square',t)}
  else if(k==='boom'){nz(t,.6,.7,700,60,'lowpass');tone(90,35,.5,.6,'sine',t)}
  else if(k==='coin'){tone(1200,1200,.07,.2,'triangle',t);tone(1800,1800,.12,.2,'triangle',t+.06)}
  else if(k==='hurt')tone(220,90,.22,.4,'sawtooth',t);
  else if(k==='freeze')nz(t,.3,.25,4000,1500,'highpass');
  else if(k==='boss'){tone(110,70,.8,.5,'sawtooth',t);tone(82,55,.9,.4,'square',t)}
  else if(k==='win')[523,659,784,1047].forEach((f,i)=>tone(f,f,.28,.25,'triangle',t+i*.1));
  else if(k==='lose')[392,349,311,262].forEach((f,i)=>tone(f,f*.97,.35,.2,'triangle',t+i*.16));
  else if(k==='click')tone(800,600,.05,.18,'square',t)}catch(e){}}
addEventListener('pointerdown',()=>ac());

/* save */
const SAVE0={coins:0,up:[0,0,0,0],ammo:Array(12).fill(0),best:0,cur:1};
function load(){try{const o=JSON.parse(localStorage.getItem('archSave'));if(o&&o.up)return Object.assign({},SAVE0,o,{ammo:(o.ammo||[]).concat(Array(12).fill(0)).slice(0,12)})}catch(e){}return JSON.parse(JSON.stringify(SAVE0))}
let save=load();const persist=()=>{try{localStorage.setItem('archSave',JSON.stringify(save))}catch(e){}};
const UP=[{n:'قدرت تیر',ic:'💥',c:30,d:'+۱۲٪ آسیب'},{n:'قدرت کمان',ic:'💪',c:30,d:'+۵٪ سرعت و برد تیر'},{n:'جان',ic:'❤️',c:25,d:'+۲۰ جان'},{n:'زره',ic:'🛡️',c:35,d:'−۴٪ آسیب دریافتی'}];
const MAXUP=10,upCost=i=>Math.round(UP[i].c*Math.pow(save.up[i]+1,1.45));
const dmgMul=()=>1+.12*save.up[0],powMul=()=>mode==='adv'?1+.05*save.up[1]:1,maxHP=()=>100+20*save.up[2],armor=()=>mode==='adv'?Math.min(.6,.04*save.up[3]):0;
const AR=[
 {n:'معمولی',ic:'🏹',col:'#f1e4bf',p:0,m:1},
 {n:'آتشین',ic:'🔥',col:'#ff7a2a',p:60,m:1.1,fx:'fire',d:'می‌سوزونه'},
 {n:'برقی',ic:'⚡',col:'#ffe94a',p:70,m:1,fx:'x'},
 {n:'سمی',ic:'☠️',col:'#7be04a',p:60,m:.9,fx:'pois',d:'مسموم می‌کنه'},
 {n:'موشکی',ic:'🚀',col:'#ff5a5a',p:90,m:1.3,fx:'boom',rad:70,g:.5,sp:1.15,d:'انفجار'},
 {n:'یخی',ic:'❄️',col:'#7fdcff',p:70,m:.8,fx:'ice',d:'یخ می‌زنه'},
 {n:'شهاب‌سنگ',ic:'☄️',col:'#ff9a3a',p:110,m:1,fx:'x'},
 {n:'سه‌تایی',ic:'🔱',col:'#c9a8ff',p:80,m:.7,fx:'tri',d:'سه تیر همزمان'},
 {n:'سنگین',ic:'🪨',col:'#a3adc2',p:60,m:2.1,sp:.85,d:'آسیب دوبرابر'},
 {n:'خون‌آشام',ic:'🩸',col:'#ff4d6d',p:90,m:1,fx:'vamp',d:'جان می‌دزده'},
 {n:'لیزری',ic:'🎯',col:'#5cf2ff',p:80,m:1.15,g:.12,sp:1.3,d:'تقریباً مستقیم'},
 {n:'بمب',ic:'💣',col:'#5a5f70',p:130,m:1.2,fx:'boom',rad:115,sp:.8,d:'انفجار بزرگ'}];

/* themes */
const TH=[
 {s:['#3a86e0','#9ad0ff','#f6f0d2'],m:['#9db6d8','#7d9dc4','#5a83ab'],t:['#2e7a3e','#1d5430'],g:['#74c64f','#3f8a2f','#5b4129'],sun:'#fff1b0',sx:650,sy:90,fog:'rgba(230,245,255,.25)'},
 {s:['#2a1d5a','#c8476a','#ffb460'],m:['#80507e','#5e3d6c','#3d2c55'],t:['#2a3a44','#182630'],g:['#9ab03e','#55802c','#4a3322'],sun:'#ffd27a',sx:520,sy:230,fog:'rgba(255,170,120,.22)'},
 {s:['#040920','#14275c','#3a4f8c'],m:['#2b3b68','#1f2e58','#16224a'],t:['#0f2a3c','#081c2c'],g:['#4a8070','#2a5a4a','#25253a'],sun:'#e8f0ff',sx:660,sy:80,fog:'rgba(120,150,230,.18)',night:1}];

/* state */
let mode='adv',wind=0,round=[0,0],dif=1,selM='adv',endW=0,evq=[],NET={on:0,host:0,mq:null,code:'',slot:0,players:[],seen:[],ph:'lobby',ver:0,acc:0,aimT:0,lastSnap:0,full:0,err:''},state='menu',L=1,th=TH[0],archers=[],arrows=[],parts=[],texts=[],towers=[],zones=[],timers=[],sel=0,time=0,shake=0,toast='',toastT=0,runCoins=0,hint=0,clearT=0,endT=0,cam=0,len=2400,slow=0,kL=0,kR=0,arrId=0,nextAfter='';
const touches={};
const flies=Array.from({length:26},(_,i)=>({x:hs(i)*W,y:hs(i+50)*H,z:.5+hs(i+9),p:hs(i+3)*6}));

function mkA(team,x,fy,o){return Object.assign({team,x,fy,face:team===0?1:-1,hp:100,max:100,cd:0,aim:null,charge:0,flash:0,burn:0,pois:0,freeze:0,stun:0,helm:0,shield:0,tri:0,dead:0,ai:null,bob:Math.random()*6,pull:0,boss:0,dmgBase:20,wp:0,mv:0},o||{})}
const sc=a=>a.boss?1.45:1;
function say(t,s){if(NET.host)evq.push(['say',t,s]);toast=t;toastT=s}

/* level generation */
function startLevel(n){mode='adv';
  L=n;th=TH[(n-1)%3];const boss=n%5===0,nz=boss?3:Math.min(4,2+(n/3|0));len=1000+nz*650;
  arrows=[];parts=[];texts=[];timers=[];towers=[];zones=[];cam=0;runCoins=0;clearT=0;slow=0;
  const p=mkA(0,120,GY,{hp:maxHP(),max:maxHP(),isP:1,dmgBase:20*dmgMul()});archers=[p];
  for(let z=0;z<nz;z++){
    const zx=850+z*650,isB=boss&&z===nz-1,cnt=isB?1:Math.min(3,1+((n+z)/4|0)),es=[];
    for(let i=0;i<cnt;i++){
      const fy=isB?GY:GY-pick([0,0,45,80]),x=zx+i*120+rnd(-20,20);
      const hp=isB?260+n*35:36+n*9;
      const e=mkA(1,x,fy,{hp,max:hp,boss:isB?1:0,dmgBase:(isB?22:15)*(1+n*.02)});
      e.ai={t:rnd(1.5,3.2),err:clamp(.11-n*.006,.018,.11),vErr:clamp(.07-n*.003,.015,.07),base:clamp(4.4-n*.13,1.9,4.4)*(isB?.8:1),v:rnd(560,700)+Math.min(n*6,120),type:0,tri:isB};
      archers.push(e);es.push(e);if(fy<GY)towers.push({x:x-34,y:fy,w:68,h:GY-fy});
    }
    zones.push({x:zx,es,done:0});
  }
  $('burger').hidden=false;state='play';hint=6;
  say(boss?'👹 غول در راهه!':'مرحله '+fa(n),2.2);snd(boss?'boss':'click');
}
const lockX=()=>{const z=zones.find(z=>!z.done);return z?z.x-430:len-30};

/* ballistics + AI */
function solve(sx,sy,tx,ty,v,g,high){const dx=Math.abs(tx-sx)||1,Y=sy-ty,d=v**4-g*(g*dx*dx+2*Y*v*v);if(d<0)return null;return Math.atan((v*v+(high?1:-1)*Math.sqrt(d))/(g*dx))}
function aiTick(a,dt){
  const A=a.ai,tg=archers.find(t=>t.team!==a.team&&t.hp>0);
  if(!tg||(mode==='adv'&&(archers[0].mv||Math.abs(a.x-tg.x)>680)))return;
  if(a.charge>0){a.charge-=dt;a.aim={ang:A.ang,pw:.9};
    if(a.charge<=0){a.aim=null;(A.tri?[-.07,0,.07]:[0]).forEach(o=>rawShoot(a,A.ang+o,A.vv,0,A.tri?.8:1));A.t=A.base*rnd(.75,1.25)}return}
  A.t-=dt*(a.pois>0?.6:1);
  if(A.t<=0){const v=A.v*(1+rnd(-A.vErr,A.vErr)),sx=a.x+a.face*12,sy=a.fy-48*sc(a),wc=mode!=='adv'?wind*.06*a.face:0;
    let q=solve(sx,sy,tg.x+wc,tg.fy-30,v,G,Math.random()<.3);if(q===null)q=solve(sx,sy,tg.x,tg.fy-30,v,G,false);
    if(q===null){A.t=.4;return}
    q+=rnd(-A.err,A.err);A.ang=a.face===1?-q:Math.PI+q;A.vv=v;a.charge=.55}
}
function rawShoot(a,ang,v,ti,m){
  const T=AR[ti],bx=a.x+a.face*12*sc(a),by=a.fy-48*sc(a);
  const mk=(an,mm)=>arrows.push({id:++arrId,x:bx,y:by,vx:Math.cos(an)*v*(T.sp||1),vy:Math.sin(an)*v*(T.sp||1),g:T.g==null?1:T.g,team:a.team,ti,dmg:a.dmgBase*T.m*mm*(m||1),col:T.col,owner:a,t:0,trail:[],fx:T.fx});
  if(T.fx==='tri'||a.tri>0){[-.09,0,.09].forEach(o=>mk(ang+o,.7));if(a.tri>0&&ti!==7)a.tri--}else mk(ang,1);
  a.pull=1;snd('shoot');if(NET.host)evq.push(['sh',a.slot])}
function playerRelease(a,pw,ang){
  if(a.cd>0||a.freeze>0||a.stun>0||a.hp<=0)return;
  if(mode==='team'&&!NET.host){netShot(a,pw,ang);return}const ti=(mode==='adv'&&sel>0&&save.ammo[sel]>0)?sel:0;
  rawShoot(a,ang,(300+600*pw)*powMul(),ti);
  if(ti>0){save.ammo[ti]--;if(save.ammo[ti]<=0)sel=0;persist()}a.cd=mode==='adv'?.45:.8}

/* damage */
function hitPart(t,x,y){const s=sc(t);if(Math.hypot(x-t.x,y-(t.fy-62*s))<12*s)return'head';if(Math.abs(x-t.x)<11*s&&y>t.fy-54*s&&y<t.fy)return'body';return null}
function txt(x,y,s,c,z){if(NET.host)evq.push(['txt',x,y,s,c||'#fff',z||18]);texts.push({x,y,t:0,s,c:c||'#fff',z:z||18})}
function spark(x,y,c,n,v,g){if(NET.host)evq.push(['spark',x,y,c,n,v,g==null?300:g]);for(let i=0;i<n;i++){const a=Math.random()*7,s=Math.random()*v;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-v*.2,l:.4+Math.random()*.5,c,r:2+Math.random()*2.5,g:g==null?300:g})}}
function earn(n){if(mode!=='adv')return;save.coins+=n;runCoins+=n}
function hurt(t,d,part,from){
  if(t.hp<=0)return 0;
  if(part==='head'&&t.helm>0){t.helm--;txt(t.x,t.fy-90,'🪖 بلاک','#ffe08a');snd('block');return 0}
  if(t.shield>0){t.shield--;txt(t.x,t.fy-90,'🛡️','#9fe8ff');snd('block');spark(t.x,t.fy-40,'#9fe8ff',8,160);return 0}
  if(t.isP)d*=1-armor();
  t.hp-=d;t.flash=.14;

  loadMqtt(()=>mqConnect(+code[1],()=>roomUI(),fail),fail);
  setTimeout(()=>{if(NET.code===code&&!NET.host&&!NET.players.length&&!NET.err){NET.err='اتاق پیدا نشد. مطمئن شو دوستت بازی رو باز گذاشته.';roomUI()}},15000)}
function onLobby(o){if(NET.host||!o.p)return;NET.err='';NET.players=o.p;NET.ph=o.ph;NET.slot=o.p.findIndex(p=>p.id===myId);NET.full=(NET.slot<0&&(o.ph==='play'||o.p.length>=4))?1:0;roomUI()}
function startTeamMatch(){round=[0,0];NET.ph='play';lobbyPub();$('room').hidden=true;$('over').hidden=true;$('again').hidden=false;$('burger').hidden=false;newRoundTeam()}
function newRoundTeam(){
  cam=0;arrows=[];parts=[];texts=[];timers=[];zones=[];evq.length=0;wind=Math.round(rnd(-110,110));
  archers=SLOT.map((d,i)=>{const pl=NET.players[i];return mkA(d.team,d.x,d.fy,pl?{slot:i,isP:1,human:1,name:pl.n||('بازیکن '+fa(i+1))}:{slot:i,human:0,name:'کامپیوتر',ai:mkAI()})});
  towers=SLOT.map(d=>({x:d.bx,y:d.fy,w:d.bw,h:GY-d.fy}));state='play';hint=5;
  put('s',{k:'rnd',w:wind,rd:round,sl:archers.map(a=>({h:a.human,n:a.name}))},{qos:1});say('دور '+fa(round[0]+round[1]+1),2);snd('wave')}
function onInput(o){
  if(!NET.host)return;
  if(o.k==='hi'){let i=NET.players.findIndex(p=>p.id===o.id);
    if(i<0&&NET.ph==='lobby'&&NET.players.length<4){NET.players.push({id:String(o.id).slice(0,12),n:String(o.n||'').slice(0,14)});i=NET.players.length-1}
    if(i>=0)NET.seen[i]=Date.now();lobbyPub();roomUI();return}
  const i=NET.players.findIndex(p=>p.id===o.id);if(i<1)return;NET.seen[i]=Date.now();
  if(state!=='play')return;const a=archers[i];if(!a||!a.human||a.hp<=0)return;
  if(o.k==='aim'){a.aim=(o.a&&isFinite(o.a[0]))?{ang:+o.a[0],pw:clamp(+o.a[1]||0,0,1)}:null}
  else if(o.k==='shot'){const ang=+o.ang,pw=clamp(+o.pw||0,0,1);if(!isFinite(ang)||pw<.12||a.cd>0||a.freeze>0||a.stun>0)return;rawShoot(a,ang,300+600*pw,0);a.cd=.8;a.aim=null}}
function netTick(dt){
  NET.acc+=dt;if(NET.acc<.09)return;NET.acc=0;const now=Date.now();
  archers.forEach((a,i)=>{if(a.human&&i>0&&now-(NET.seen[i]||now)>9000){a.human=0;a.isP=0;a.aim=null;a.ai=mkAI();say(a.name+' قطع شد؛ کامپیوتر جاش بازی می‌کنه',2)}});
  put('s',{k:'snap',w:wind,A:archers.map(a=>[Math.round(a.hp),+a.dead.toFixed(2),a.freeze>0?1:0,a.aim?+a.aim.ang.toFixed(3):null,a.aim?+a.aim.pw.toFixed(2):0]),
    B:arrows.map(a=>[a.id,Math.round(a.x),Math.round(a.y),Math.round(a.vx),Math.round(a.vy),a.stuck?(a.stuck.tg?2:1):0,+a.t.toFixed(2),a.team]),E:evq.splice(0,40)})}
function onCtl(o){if(NET.host)return;NET.lastSnap=Date.now();if(o.k==='snap'){if(state==='play'&&archers.length)applySnap(o)}else if(o.k==='rnd')onRound(o);else if(o.k==='end')onEnd(o)}
function onRound(o){if(NET.slot<0)return;wind=o.w;round=o.rd;cam=0;
  archers=SLOT.map((d,i)=>{const q=o.sl[i]||{};return mkA(d.team,d.x,d.fy,{slot:i,isP:q.h?1:0,human:q.h,name:q.n})});
  towers=SLOT.map(d=>({x:d.bx,y:d.fy,w:d.bw,h:GY-d.fy}));arrows=[];parts=[];texts=[];timers=[];state='play';hint=5;
  ['over','room','setup','menu'].forEach(i=>$(i).hidden=true);$('burger').hidden=false}
function onEnd(o){round=o.rd;state='over';$('burger').hidden=true;$('menu').hidden=true;
  const mt=archers[NET.slot]?archers[NET.slot].team:0,win=o.w===mt;$('ot').textContent=win?'🏆 تیم شما برد!':'😅 تیم شما باخت';
  $('ox').textContent='دورها: '+fa(round[0])+' : '+fa(round[1])+' — منتظر میزبان برای بازی دوباره';$('again').hidden=true;$('over').hidden=false;snd(win?'win':'lose')}
function applyEv(e){const k=e[0];if(k==='snd')snd(e[1]);else if(k==='txt')txt(e[1],e[2],e[3],e[4],e[5]);else if(k==='spark')spark(e[1],e[2],e[3],e[4],e[5],e[6]);else if(k==='say')say(e[1],e[2]);else if(k==='sh'){const a=archers[e[1]];if(a)a.pull=1}}
function applySnap(o){wind=o.w;
  o.A.forEach((r,i)=>{const a=archers[i];if(!a)return;if(r[0]<a.hp)a.flash=.14;a.hp=r[0];a.dead=r[1];a.freeze=r[2];if(i!==NET.slot)a.aim=r[3]==null?null:{ang:r[3],pw:r[4]}});
  const old=new Map(arrows.map(a=>[a.id,a]));
  arrows=o.B.map(r=>{let a=old.get(r[0]);if(!a)a={id:r[0],trail:[],col:AR[0].col,ti:0,g:1};a.x=r[1];a.y=r[2];a.vx=r[3];a.vy=r[4];a.stuck=r[5]===2?{tg:1}:r[5]===1?{}:null;a.t=r[6];a.team=r[7];return a});
  (o.E||[]).forEach(applyEv)}
function guestUpdate(dt){
  time+=dt;shake=Math.max(0,shake-dt*1.4);toastT=Math.max(0,toastT-dt);hint=Math.max(0,hint-dt);
  texts.forEach(t=>{t.t+=dt;t.y-=30*dt});texts=texts.filter(t=>t.t<1);parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.g||0)*dt;p.l-=dt});parts=parts.filter(p=>p.l>0);
  archers.forEach(a=>{a.bob+=dt*2;a.flash=Math.max(0,a.flash-dt);a.cd=Math.max(0,a.cd-dt);a.pull=Math.max(0,a.pull-dt*5);if(a.hp<=0)a.dead+=dt});
  arrows.forEach(a=>{if(a.stuck){a.t+=dt;return}a.vy+=G*dt;a.vx+=wind*dt;a.x+=a.vx*dt;a.y+=a.vy*dt;a.trail.push({x:a.x,y:a.y});if(a.trail.length>9)a.trail.shift()});
  if(NET.lastSnap&&Date.now()-NET.lastSnap>6000&&toastT<=0)say('ارتباط با میزبان قطع شده…',1.5)}
function netAim(a,force){if(NET.host||!NET.mq)return;const n=Date.now();if(!force&&n-NET.aimT<90)return;NET.aimT=n;put('i',{k:'aim',id:myId,a:a.aim?[+a.aim.ang.toFixed(3),+a.aim.pw.toFixed(2)]:null})}
function netShot(a,pw,ang){put('i',{k:'shot',id:myId,pw:+pw.toFixed(2),ang:+ang.toFixed(3)},{qos:1});a.cd=.8;a.pull=1}
setInterval(()=>{if(mode==='team'&&!NET.host&&NET.on)put('i',{k:'hb',id:myId})},2500);
$('share').onclick=()=>{const u='https://t.me/share/url?url='+encodeURIComponent(teamLink())+'&text='+encodeURIComponent('بیا تیراندازها بازی کنیم 🏹');if(tg&&tg.openTelegramLink)tg.openTelegramLink(u);else window.open(u,'_blank')};
$('copy').onclick=()=>{try{navigator.clipboard.writeText(teamLink());$('copy').textContent='کپی شد ✓'}catch(e){prompt('لینک:',teamLink())}};
$('rstart').onclick=()=>{if(NET.host&&NET.players.length>=2)startTeamMatch()};
$('rleave').onclick=()=>showMenu();
muteLabel();fit();showMenu();requestAnimationFrame(frame);
(function(){const q=new URLSearchParams(location.search),sp=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param,room=q.get('room')||sp||q.get('tgWebAppStartParam');if(room&&/^a[0-2][a-z0-9]{5}$/.test(room))teamJoin(room)})();
</script>
