<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>تخته نرد</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
:root{--saffron:#e0a526;--ivory:#efe6d0;--bg:#1b1410;--card:#2a190e}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ivory);font-family:Tahoma,Arial,sans-serif;user-select:none;touch-action:manipulation}
#app{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;gap:8px;padding:6px;overflow:hidden}
#bd{flex:1;min-width:0;height:100%;direction:ltr}
#side{width:178px;flex:none;display:flex;flex-direction:column;gap:6px;overflow-y:auto;text-align:center;font-size:13px}
button{font-family:inherit;font-size:14px;padding:8px 10px;border:0;border-radius:8px;background:#4a3322;color:var(--ivory)}
button.main,button.on{background:var(--saffron);color:#2a1a0c;font-weight:bold}
button:disabled{opacity:.35}
#score{background:var(--card);border-radius:8px;padding:6px;line-height:1.7}
#st{min-height:38px;font-size:14px;line-height:1.5}
#dice{font-size:36px;line-height:1.1;min-height:40px;direction:ltr;letter-spacing:2px}
#dice .u{opacity:.25}
#ctl{display:flex;flex-direction:column;gap:6px}
#room{background:var(--card);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px}
#info{font-size:11px;opacity:.7;line-height:1.6}
#setup{position:absolute;inset:0;background:var(--bg);z-index:5;display:flex;align-items:center;justify-content:center;overflow:auto}
#setup .box{display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;padding:10px}
#setup h2{margin:0;font-size:24px}
#setup .row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#ns button{width:42px;height:42px;padding:0;font-size:18px}
#go{font-size:17px;padding:11px 36px}
</style>
</head>
<body>
<div id="app">
  <svg id="bd" viewBox="0 0 704 430"></svg>
  <div id="side">
    <div id="score"></div>
    <div id="st"></div>
    <div id="dice"></div>
    <div id="room" hidden><div id="rmsg"></div><button id="share" class="main">📨 ارسال دعوت‌نامه</button><button id="copy">کپی لینک</button></div>
    <div id="ctl">
      <button id="roll" class="main">🎲 تاس بنداز</button>
      <button id="next" class="main" hidden>دست بعدی ▶</button>
      <button id="undo">↩ برگشت</button>
      <button id="mute">🔊 صدا</button>
      <button id="menu">☰ منو</button>
    </div>
    <div id="info"></div>
  </div>
  <div id="setup">
    <div class="box">
      <h2>🎲 تخته نرد</h2>
      <div>نوع بازی</div>
      <div class="row" id="modes"><button data-m="ai" class="on">با کامپیوتر</button><button data-m="pvp">دو نفره (یک گوشی)</button><button data-m="online">آنلاین با دوست</button></div>
      <div>تعداد دست‌ها</div>
      <div class="row" id="ns"></div>
      <button id="go" class="main">شروع بازی</button>
    </div>
  </div>
</div>

<script>
const tg=window.Telegram&&window.Telegram.WebApp;
if(tg){try{tg.ready();tg.expand();if(tg.disableVerticalSwipes)tg.disableVerticalSwipes();}catch(e){}}
try{screen.orientation.lock('landscape').catch(()=>{});}catch(e){}
const $=id=>document.getElementById(id);
const X0=14,X1=346,PW=48;
const FACE='⚀⚁⚂⚃⚄⚅';
const ALPHA='abcdefghjkmnpqrstuvwxyz23456789';
const BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081'];
// بعد از ساختن Mini App در BotFather، لینکش اینجاست
const APP_LINK='https://t.me/Dongbegir_bot/nard';
const rd=()=>1+Math.floor(Math.random()*6);
const pi=p=>p===1?0:1;
let S,turn,dice=[],shown=[],hist=[],mode='ai',sel=null,over=false,busy=false,NM=[];
let msg=null,note='',ser={n:3,w:[0,0],h:1,fin:false};
let my=1,wait=false,code='',gid=0,mq=null,ver=0,guestId=null;
const myId=Math.random().toString(36).slice(2,10);
const later=(fn,ms)=>{const g=gid;setTimeout(()=>{if(g===gid)fn();},ms);};
const mine=()=>wait?false:mode==='ai'?turn===1:mode==='online'?turn===my:true;
const aiTurn=()=>mode==='ai'&&turn===-1;

/* ---------- sound (synthesized, no files) ---------- */
let AC=null,muted=false;
try{muted=localStorage.getItem('nardMute')==='1';}catch(e){}
function ac(){
  try{
    if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C();}
    if(AC&&AC.state==='suspended')AC.resume();
  }catch(e){}
  return AC;
}
function tone(f0,f1,dur,vol,type,t0){
  const a=AC,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t0);o.frequency.exponentialRampToValueAtTime(f1,t0+dur);
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+dur+0.02);
}
function nz(t0,dur,vol,freq){
  const a=AC,n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource();s.buffer=b;
  const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=1.2;
  const g=a.createGain();g.gain.value=vol;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t0);
}
function snd(k){
  try{
    if(muted||!ac())return;
    const t=AC.currentTime;
    if(k==='dice'){
      for(let i=0;i<9;i++){const tt=t+i*0.055+Math.random()*0.03;nz(tt,0.04,0.6,1800+Math.random()*2500);tone(300+Math.random()*200,120,0.05,0.15,'triangle',tt);}
    }else if(k==='move'){tone(220,90,0.09,0.55,'sine',t);nz(t,0.03,0.6,1400);}
    else if(k==='hit'){tone(200,70,0.12,0.65,'sine',t);nz(t,0.04,0.7,900);tone(160,60,0.12,0.55,'sine',t+0.09);nz(t+0.09,0.04,0.6,900);}
    else if(k==='off'){tone(330,150,0.1,0.45,'triangle',t);nz(t,0.03,0.5,2200);}
    else if(k==='win'){[523,659,784,1047].forEach((f,i)=>tone(f,f,0.18,0.3,'triangle',t+i*0.12));}
  }catch(e){}
}
addEventListener('pointerdown',()=>{ac();});
const moveSnd=(s,p,m)=>snd(m.t==='off'?'off':(s.b[m.t]===-p?'hit':'move'));

/* ---------- fit: landscape ---------- */
function fit(){
  const w=innerWidth,h=innerHeight,a=$('app').style;
  a.cssText=h>w?`position:fixed;top:0;left:${w}px;width:${h}px;height:${w}px;transform-origin:0 0;transform:rotate(90deg)`
               :'position:fixed;top:0;left:0;width:100%;height:100%';
}
addEventListener('resize',fit);fit();

/* ---------- rules ---------- */
function newState(){const b=Array(24).fill(0);b[5]=5;b[7]=3;b[12]=5;b[23]=2;b[18]=-5;b[16]=-3;b[11]=-5;b[0]=-2;return{b,bar:[0,0],off:[0,0]};}
const clone=s=>({b:s.b.slice(),bar:s.bar.slice(),off:s.off.slice()});
function legal(s,p,die){
  const r=[],d=-p,k=pi(p);
  if(s.bar[k]>0){const e=p===1?24-die:die-1;if(s.b[e]*p>=-1)r.push({f:'bar',t:e,d:die});return r;}
  let home=true;
  for(let i=0;i<24;i++)if(s.b[i]*p>0&&!(p===1?i<=5:i>=18)){home=false;break;}
  for(let i=0;i<24;i++){
    if(s.b[i]*p<=0)continue;
    const t=i+d*die;
    if(t>=0&&t<24){if(s.b[t]*p>=-1)r.push({f:i,t,d:die});}
    else if(home){
      const pip=p===1?i+1:24-i;
      if(die===pip)r.push({f:i,t:'off',d:die});
      else if(die>pip){
        let far=false;
        for(let j=0;j<24;j++)if(s.b[j]*p>0&&(p===1?j+1:24-j)>pip){far=true;break;}
        if(!far)r.push({f:i,t:'off',d:die});
      }
    }
  }
  return r;
}
function apply(s,p,m){
  const k=pi(p),o=pi(-p);
  if(m.f==='bar')s.bar[k]--;else s.b[m.f]-=p;
  if(m.t==='off')s.off[k]++;
  else{if(s.b[m.t]===-p){s.b[m.t]=0;s.bar[o]++;}s.b[m.t]+=p;}
}
function seqs(s,p,ds){
  let best=[],mx=0;
  (function go(st,rem,path){
    let ext=false;
    for(const die of new Set(rem)){
      for(const m of legal(st,p,die)){
        ext=true;const n=clone(st);apply(n,p,m);
        const r=rem.slice();r.splice(r.indexOf(die),1);
        go(n,r,path.concat([m]));
      }
    }
    if(!ext&&path.length){
      if(path.length>mx){mx=path.length;best=[];}
      if(path.length===mx)best.push({path,st});
    }
  })(s,ds,[]);
  if(mx===1&&ds.length===2&&ds[0]!==ds[1]){
    const hi=Math.max(ds[0],ds[1]);
    if(best.some(x=>x.path[0].d===hi))best=best.filter(x=>x.path[0].d===hi);
  }
  return best;
}
const nextMoves=()=>dice.length?seqs(S,turn,dice).map(x=>x.path[0]):[];
const pips=(s,p)=>{let t=s.bar[pi(p)]*25;for(let i=0;i<24;i++)if(s.b[i]*p>0)t+=Math.abs(s.b[i])*(p===1?i+1:24-i);return t;};
const name=p=>mode==='ai'?(p===1?'شما':'کامپیوتر'):mode==='online'?(p===my?'شما':'دوستت'):(p===1?'سفید':'سیاه');

function checkWin(){
  for(const p of[1,-1]){
    const k=pi(p);
    if(S.off[k]!==15)continue;
    over=true;snd('win');const lo=pi(-p);let pts=1;
    if(S.off[lo]===0){
      pts=2;const inH=i=>p===1?i<=5:i>=18;
      if(S.bar[lo]>0||S.b.some((c,i)=>c*(-p)>0&&inH(i)))pts=3;
    }
    ser.w[k]+=pts;
    const tie=ser.h>=ser.n&&ser.w[0]===ser.w[1];
    if(ser.h>=ser.n&&!tie){ser.fin=true;msg={k:'fin',p:ser.w[0]>ser.w[1]?1:-1};clearRoom();}
    else{if(tie)ser.n++;msg={k:'win',p,pts,tie};}
  }
}
function msgText(){
  if(note)return note;
  if(!msg)return '';
  if(msg.k==='start')return 'تاس اول: '+name(turn)+' شروع می‌کند';
  if(msg.k==='pass')return 'حرکتی ممکن نیست؛ نوبت '+name(turn)+' رد می‌شود';
  if(msg.k==='win')return '🏆 '+name(msg.p)+' این دست را برد ('+['','ساده ۱','گمون ۲','بک‌گمون ۳'][msg.pts]+' امتیاز)'+(msg.tie?' — مساوی شد، یک دست اضافه':'');
  if(msg.k==='fin')return '🏆 '+name(msg.p)+' برنده کل مسابقه شد ('+ser.w[0]+' به '+ser.w[1]+')';
  return '';
}

/* ---------- flow ---------- */
function init(){
  gid++;S=newState();over=false;busy=false;sel=null;hist=[];wait=false;note='';
  let a,b;do{a=rd();b=rd();}while(a===b);
  turn=a>b?1:-1;dice=[a,b];shown=[a,b];msg={k:'start'};
  snd('dice');pub();after();
}
function rollFor(){
  const a=rd(),b=rd();
  shown=a===b?[a,a,a,a]:[a,b];dice=shown.slice();hist=[];sel=null;msg=null;
  snd('dice');pub();after();
}
function after(){
  render();
  if(over)return;
  if(mode==='online'&&!mine())return;
  if(dice.length){
    if(!seqs(S,turn,dice).length){
      busy=true;msg={k:'pass'};render();pub();
      later(()=>{busy=false;endTurn();},1400);
    }else if(aiTurn())aiPlay();
  }else if(aiTurn()){
    busy=true;render();
    later(()=>{busy=false;rollFor();},700);
  }
}
function endTurn(){turn=-turn;dice=[];shown=[];hist=[];sel=null;msg=null;pub();after();}
function doMove(m){
  hist.push({S:clone(S),dice:dice.slice()});
  moveSnd(S,turn,m);apply(S,turn,m);dice.splice(dice.indexOf(m.d),1);sel=null;
  checkWin();pub();
  if(over){render();return;}
  if(!dice.length){busy=true;render();later(()=>{busy=false;endTurn();},500);}
  else after();
}
function click(v){
  if(over||busy||!dice.length||!mine())return;
  if(sel!==null){
    const m=NM.filter(m=>m.f===sel&&m.t===v).sort((a,b)=>a.d-b.d)[0];
    if(m){doMove(m);return;}
  }
  sel=NM.some(m=>m.f===v)?v:null;
  render();
}

/* ---------- computer player ---------- */
function evalS(s){
  let v=0;
  for(let i=0;i<24;i++){
    const c=-s.b[i];
    if(c===1){
      v-=4;
      let hit=s.bar[0]>0&&i>=18;
      for(let j=i+1;j<24&&!hit;j++)if(s.b[j]>0&&j-i<=12)hit=true;
      if(hit)v-=5;
    }else if(c>=2)v+=3+(i>=18?2:0)+(i>=12?1:0);
  }
  v+=12*s.bar[0]-12*s.bar[1]+14*s.off[1]+(pips(s,1)-pips(s,-1))*0.4;
  return v;
}
function aiPlay(){
  busy=true;render();
  const all=seqs(S,-1,dice);let best=all[0],bv=-1e9;
  for(const x of all){const v=evalS(x.st)+Math.random()*1.5;if(v>bv){bv=v;best=x;}}
  best.path.forEach((m,i)=>later(()=>{
    moveSnd(S,-1,m);apply(S,-1,m);dice.splice(dice.indexOf(m.d),1);checkWin();render();
    if(i===best.path.length-1&&!over)later(()=>{busy=false;endTurn();},600);
  },(i+1)*700));
}

/* ---------- online (MQTT relay: no direct phone-to-phone link needed) ---------- */
const T=s=>'tnard/'+code+'/'+s;
function saveRoom(){try{localStorage.setItem('nardRoom',JSON.stringify({code,my,t:Date.now()}));}catch(e){}}
function clearRoom(){try{localStorage.removeItem('nardRoom');}catch(e){}}
function loadRoom(){try{const o=JSON.parse(localStorage.getItem('nardRoom'));return o&&Date.now()-o.t<6*3600e3?o:null;}catch(e){return null;}}
function closeNet(){try{if(mq)mq.end(true);}catch(e){}mq=null;}
function blank(){gid++;S=newState();turn=1;dice=[];shown=[];hist=[];over=false;busy=false;sel=null;msg=null;}
function link(){return APP_LINK+'?startapp='+code;}
function pub(){
  if(mode!=='online'||!mq)return;
  ver++;
  mq.publish(T('st'),JSON.stringify({v:ver,f:myId,g:guestId,S,turn,dice,shown,over,msg,ser}),{qos:1,retain:true});
}
function onSt(o){
  if(o.f===myId||o.v<=ver)return;
  if(my===-1&&o.g&&o.g!==myId){note='این اتاق پر است.';render();return;}
  const pS=JSON.stringify(S),pSh=JSON.stringify(shown),pOv=over;
  ver=o.v;gid++;S=o.S;turn=o.turn;dice=o.dice;shown=o.shown;over=o.over;msg=o.msg;ser=o.ser;
  guestId=o.g||guestId;busy=false;sel=null;wait=false;note='';hist=[];
  $('room').hidden=true;
  if(over&&!pOv)snd('win');
  else if(JSON.stringify(shown)!==pSh&&shown.length)snd('dice');
  else if(JSON.stringify(S)!==pS)snd('move');
  if(!over&&mine()&&dice.length)after();else render();
}
function onHi(o){
  if(my!==1)return;
  if(!guestId)guestId=o.id;
  if(o.id!==guestId)return;
  if(wait){wait=false;note='';$('room').hidden=true;init();}else pub();
}
function mqConnect(i,ok,fail){
  if(typeof mqtt==='undefined'){fail();return;}
  let done=false;
  const c=mqtt.connect(BROKERS[i],{clientId:'tn'+myId+i,connectTimeout:6000,reconnectPeriod:3000});
  const t=setTimeout(()=>{if(!done){done=true;try{c.end(true);}catch(e){}fail();}},7000);
  c.on('connect',()=>{
    if(!done){done=true;clearTimeout(t);mq=c;ok();}
    if(c!==mq)return;
    if(note.startsWith('ارتباط')){note='';render();}
    c.subscribe(T('st'),{qos:1});
    if(my===1)c.subscribe(T('hi'),{qos:1});
    else c.publish(T('hi'),JSON.stringify({id:myId}),{qos:1});
  });
  c.on('offline',()=>{if(c===mq&&mode==='online'){note='ارتباط قطع شد؛ در حال اتصال مجدد…';render();}});
  c.on('error',()=>{});
  c.on('message',(tp,m)=>{
    if(c!==mq)return;
    let o;try{o=JSON.parse(m.toString());}catch(e){return;}
    if(tp.endsWith('/st'))onSt(o);else if(tp.endsWith('/hi'))onHi(o);
  });
}
function startOnline(){closeNet();mode='online';my=1;wait=true;guestId=null;ver=0;blank();tryHost(0);}
function tryHost(i){
  if(i>=BROKERS.length){note='اتصال به سرور بازی برقرار نشد. اینترنت یا فیلترشکن رو چک کن.';render();return;}
  code=i+Array.from({length:5},()=>ALPHA[Math.floor(Math.random()*ALPHA.length)]).join('');
  $('room').hidden=false;$('rmsg').textContent='در حال ساخت اتاق…';render();
  mqConnect(i,()=>{
    $('rmsg').textContent='دعوت‌نامه رو برای دوستت بفرست. وقتی وارد شد بازی شروع می‌شه.';
    saveRoom();render();
  },()=>tryHost(i+1));
}
function joinRoom(role,cd){
  closeNet();mode='online';my=role;code=cd;wait=true;guestId=null;ver=0;blank();
  note='در حال اتصال…';$('setup').hidden=true;render();
  mqConnect(+cd[0],()=>saveRoom(),()=>{note='اتصال به سرور بازی برقرار نشد.';render();});
  later(()=>{if(wait){note=role===-1?'اتصال برقرار نشد. مطمئن شو دوستت بازی رو باز گذاشته.':'بازی قبلی پیدا نشد.';render();}},15000);
}

/* ---------- drawing ---------- */
function xOf(i){
  if(i>=6&&i<=11)return X0+(11-i)*PW;
  if(i<=5)return X1+(5-i)*PW;
  if(i<=17)return X0+(i-12)*PW;
  return X1+(i-18)*PW;
}
function tri(i){
  const x=xOf(i);
  return i>=12?`${x},10 ${x+PW},10 ${x+PW/2},200`:`${x},420 ${x+PW},420 ${x+PW/2},230`;
}
function chk(x,y,r,p,hl){
  return `<circle cx="${x}" cy="${y}" r="${r}" fill="${p===1?'#efe6d0':'#241c18'}" stroke="${hl?'#ffd400':p===1?'#9a8c70':'#000'}" stroke-width="${hl?4:2}"/>`+
         `<circle cx="${x}" cy="${y}" r="${r-6}" fill="none" stroke="${p===1?'#cbbd9c':'#4a3b33'}" stroke-width="1.5"/>`;
}
function render(){
  NM=(mine()&&dice.length&&!busy&&!over)?nextMoves():[];
  const dests=new Set(NM.filter(m=>sel!==null&&m.f===sel).map(m=>m.t));
  const srcs=new Set(NM.map(m=>m.f));
  let g='<rect width="704" height="430" rx="12" fill="#3b2416"/>'+
        '<rect x="14" y="10" width="288" height="410" fill="#1f6f78"/><rect x="346" y="10" width="288" height="410" fill="#1f6f78"/>'+
        '<rect x="302" y="10" width="44" height="410" fill="#2a190e"/><rect x="642" y="10" width="56" height="410" fill="#2a190e"/>';
  for(let i=0;i<24;i++)g+=`<polygon points="${tri(i)}" fill="${i%2?'#e8d9b0':'#9c2f2a'}"/>`;
  for(const t of dests){
    if(t==='off')g+=`<rect x="644" y="${turn===1?232:12}" width="52" height="186" fill="#ffd400" fill-opacity=".35" stroke="#ffd400" stroke-width="3"/>`;
    else g+=`<polygon points="${tri(t)}" fill="#ffd400" fill-opacity=".55"/>`;
  }
  for(let i=0;i<24;i++){
    const c=Math.abs(S.b[i]);if(!c)continue;
    const p=S.b[i]>0?1:-1,x=xOf(i)+PW/2,tp=i>=12,sp=Math.min(44,148/Math.max(1,c-1));
    for(let k=0;k<c;k++){
      const y=tp?31+k*sp:399-k*sp,top=k===c-1;
      g+=chk(x,y,21,p,top&&(sel===i||(sel===null&&srcs.has(i))));
      if(top&&c>5)g+=`<text x="${x}" y="${y}" dy=".35em" text-anchor="middle" font-size="16" font-weight="bold" fill="${p===1?'#222':'#eee'}">${c}</text>`;
    }
  }
  for(const p of[1,-1]){
    const n=S.bar[pi(p)];
    for(let k=0;k<n;k++){
      const y=p===1?260+k*26:170-k*26;
      g+=chk(324,y,18,p,k===n-1&&p===turn&&(sel==='bar'||(sel===null&&srcs.has('bar'))));
    }
    for(let k=0;k<S.off[pi(p)];k++){
      const y=p===1?409-k*11:12+k*11;
      g+=`<rect x="650" y="${y}" width="40" height="9" rx="2" fill="${p===1?'#efe6d0':'#241c18'}" stroke="${p===1?'#9a8c70':'#000'}"/>`;
    }
  }
  for(let i=0;i<24;i++){
    const x=xOf(i),y=i>=12?10:230;
    g+=`<rect data-i="${i}" x="${x}" y="${y}" width="${PW}" height="190" fill="#000" fill-opacity="0"/>`;
  }
  g+='<rect data-i="bar" x="302" y="10" width="44" height="410" fill="#000" fill-opacity="0"/>'+
     '<rect data-i="off" x="642" y="10" width="56" height="190" fill="#000" fill-opacity="0"/>'+
     '<rect data-i="off" x="642" y="230" width="56" height="190" fill="#000" fill-opacity="0"/>';
  $('bd').innerHTML=g;

  const usedN=shown.length-dice.length;
  $('dice').innerHTML=shown.map((d,i)=>`<span class="${i<usedN?'u':''}">${FACE[d-1]}</span>`).join('');
  $('score').innerHTML=`دست ${ser.h} از ${ser.n}<br>${name(1)} ${ser.w[0]} : ${ser.w[1]} ${name(-1)}`;
  $('st').textContent=msgText()||(wait?'منتظر اتصال…':over?'':'نوبت: '+name(turn)+(mine()&&!dice.length?' — تاس بنداز':busy?' …':''));
  $('roll').disabled=!(mine()&&!dice.length&&!over&&!busy);
  $('undo').disabled=!(mine()&&hist.length&&!over&&!busy&&mode!=='online');
  $('next').hidden=!(over&&!ser.fin&&(mode!=='online'||my===1));
  $('info').textContent=`پیپ ${name(1)}: ${pips(S,1)} (خارج ${S.off[0]})\nپیپ ${name(-1)}: ${pips(S,-1)} (خارج ${S.off[1]})`;
  $('info').style.whiteSpace='pre-line';
}

/* ---------- events ---------- */
$('bd').addEventListener('click',e=>{
  const v=e.target.dataset&&e.target.dataset.i;
  if(v===undefined)return;
  click(v==='bar'||v==='off'?v:+v);
});
$('roll').onclick=()=>{if(!busy&&!over&&!dice.length&&mine())rollFor();};
$('undo').onclick=()=>{
  if(!hist.length||busy)return;
  const h=hist.pop();S=h.S;dice=h.dice;sel=null;msg=null;render();
};
$('next').onclick=()=>{if(over&&!ser.fin&&(mode!=='online'||my===1)){ser.h++;init();}};
$('menu').onclick=()=>{closeNet();clearRoom();gid++;busy=false;mode='ai';wait=false;note='';$('room').hidden=true;$('setup').hidden=false;};
function muteLabel(){$('mute').textContent=muted?'🔇 بی‌صدا':'🔊 صدا';}
$('mute').onclick=()=>{muted=!muted;try{localStorage.setItem('nardMute',muted?'1':'0');}catch(e){}muteLabel();if(!muted)snd('move');};
muteLabel();
$('share').onclick=()=>{
  const u='https://t.me/share/url?url='+encodeURIComponent(link())+'&text='+encodeURIComponent('بیا تخته نرد بازی کنیم 🎲');
  if(tg&&tg.openTelegramLink)tg.openTelegramLink(u);else window.open(u,'_blank');
};
$('copy').onclick=()=>{
  try{navigator.clipboard.writeText(link());$('copy').textContent='کپی شد ✓';}catch(e){prompt('لینک:',link());}
};
let selMode='ai',selN=3;
for(let n=1;n<=7;n++){const b=document.createElement('button');b.textContent=n;b.dataset.n=n;if(n===selN)b.className='on';$('ns').appendChild(b);}
$('modes').onclick=e=>{const m=e.target.dataset.m;if(!m)return;selMode=m;[...$('modes').children].forEach(b=>b.classList.toggle('on',b.dataset.m===m));};
$('ns').onclick=e=>{const n=e.target.dataset.n;if(!n)return;selN=+n;[...$('ns').children].forEach(b=>b.classList.toggle('on',+b.dataset.n===selN));};
$('go').onclick=()=>{
  ser={n:selN,w:[0,0],h:1,fin:false};closeNet();clearRoom();$('setup').hidden=true;note='';
  if(selMode==='online')startOnline();
  else{mode=selMode;wait=false;init();}
};

/* ---------- start ---------- */
function boot(){
  blank();render();
  const sp=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param;
  const room=sp||new URLSearchParams(location.search).get('room')||new URLSearchParams(location.search).get('tgWebAppStartParam');
  if(room&&/^[0-2][a-z0-9]{5}$/.test(room)){joinRoom(-1,room);return;}
  const sv=loadRoom();
  if(sv){
    const q='بازی آنلاین قبلی‌ات هنوز ادامه داره. برگردی به اون؟';
    const yes=()=>{$('setup').hidden=true;joinRoom(sv.my,sv.code);};
    const no=()=>{clearRoom();};
    if(tg&&tg.showConfirm)tg.showConfirm(q,ok=>ok?yes():no());else if(confirm(q))yes();else no();
  }
}
boot();
</script>
</body>
</html>
