<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>تخته نرد</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--wood:#3b2416;--teal:#1f6f78;--ivory:#efe6d0;--saffron:#e0a526;--bg:#1b1410}
[hidden]{display:none!important}
#room{background:#2a190e;border-radius:10px;padding:10px;margin:6px auto;max-width:420px}
#rmsg{margin-bottom:8px;font-size:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:8px;background:var(--bg);color:var(--ivory);font-family:Tahoma,Arial,sans-serif;text-align:center;user-select:none}
#top{display:flex;gap:8px;justify-content:center;margin-bottom:6px}
select,button{font-family:inherit;font-size:15px;padding:9px 14px;border:0;border-radius:8px;background:#4a3322;color:var(--ivory)}
button.main{background:var(--saffron);color:#2a1a0c;font-weight:bold}
button:disabled{opacity:.35}
#st{min-height:26px;font-size:16px;margin:4px 0}
#bd{width:100%;max-width:760px;direction:ltr;display:block;margin:0 auto}
#dice{font-size:54px;line-height:1.1;min-height:60px;letter-spacing:6px;direction:ltr}
#dice .u{opacity:.25}
#ctl{display:flex;gap:8px;justify-content:center;margin:4px 0}
#info{font-size:13px;opacity:.75;margin-top:6px}
</style>
</head>
<body>
<div id="top">
  <select id="mode"><option value="ai">با کامپیوتر</option><option value="pvp">دو نفره (یک گوشی)</option><option value="online">آنلاین با دوست</option></select>
  <button id="new">بازی جدید</button>
</div>
<div id="room" hidden><div id="rmsg"></div><button id="share" class="main">📨 ارسال دعوت‌نامه</button> <button id="copy">کپی لینک</button></div>
<div id="st"></div>
<svg id="bd" viewBox="0 0 704 430"></svg>
<div id="dice"></div>
<div id="ctl">
  <button id="roll" class="main">🎲 تاس بنداز</button>
  <button id="undo">↩ برگشت</button>
</div>
<div id="info"></div>

<script>
const tg=window.Telegram&&window.Telegram.WebApp;if(tg){tg.ready();tg.expand();}
const $=id=>document.getElementById(id);
const X0=14,X1=346,PW=48;
const FACE='⚀⚁⚂⚃⚄⚅';
const rd=()=>1+Math.floor(Math.random()*6);
const pi=p=>p===1?0:1;
// بعد از ساختن Mini App در BotFather، لینکش رو اینجا بذار. مثال: 'https://t.me/YourBot/nard'
const APP_LINK='https://t.me/Dongbegir_bot/nard';
let S,turn,dice=[],shown=[],hist=[],mode='ai',sel=null,over=false,busy=false,NM=[],msg='';
let my=1,peer=null,conn=null,wait=false,code='',gid=0;
const later=(fn,ms)=>{const g=gid;setTimeout(()=>{if(g===gid)fn();},ms);};
const mine=()=>wait?false:mode==='ai'?turn===1:mode==='online'?turn===my:true;

/* ---------- rules ---------- */
function newState(){const b=Array(24).fill(0);b[5]=5;b[7]=3;b[12]=5;b[23]=2;b[18]=-5;b[16]=-3;b[11]=-5;b[0]=-2;return{b,bar:[0,0],off:[0,0]};}
const clone=s=>({b:s.b.slice(),bar:s.bar.slice(),off:s.off.slice()});
// player 1 (white) moves 23 -> 0, home 0..5 ; player -1 (black) moves 0 -> 23, home 18..23
function legal(s,p,die){
  const r=[],d=-p,k=pi(p);
  if(s.bar[k]>0){const e=p===1?24-die:die-1;if(s.b[e]*p>=-1)r.push({f:'bar',t:e,d:die});return r;}
  let home=true;
  for(let i=0;i<24;i++)if(s.b[i]*p>0&&!(p===1?i<=5:i>=18)){home=false;break;}
  for(let i=0;i<24;i++){
    if(s.b[i]*p<=0)continue;
    const t=i+d*die;
    if(t>=0&&t<24){if(s.b[t]*p>=-1)r.push({f:i,t,d:die});}
    else if(home){
      const pip=p===1?i+1:24-i;
      if(die===pip)r.push({f:i,t:'off',d:die});
      else if(die>pip){
        let far=false;
        for(let j=0;j<24;j++)if(s.b[j]*p>0&&(p===1?j+1:24-j)>pip){far=true;break;}
        if(!far)r.push({f:i,t:'off',d:die});
      }
    }
  }
  return r;
}
function apply(s,p,m){
  const k=pi(p),o=pi(-p);
  if(m.f==='bar')s.bar[k]--;else s.b[m.f]-=p;
  if(m.t==='off')s.off[k]++;
  else{if(s.b[m.t]===-p){s.b[m.t]=0;s.bar[o]++;}s.b[m.t]+=p;}
}
// all maximal move sequences (must use as many dice as possible; larger die if only one playable)
function seqs(s,p,ds){
  let best=[],mx=0;
  (function go(st,rem,path){
    let ext=false;
    for(const die of new Set(rem)){
      for(const m of legal(st,p,die)){
        ext=true;const n=clone(st);apply(n,p,m);
        const r=rem.slice();r.splice(r.indexOf(die),1);
        go(n,r,path.concat([m]));
      }
    }
    if(!ext&&path.length){
      if(path.length>mx){mx=path.length;best=[];}
      if(path.length===mx)best.push({path,st});
    }
  })(s,ds,[]);
  if(mx===1&&ds.length===2&&ds[0]!==ds[1]){
    const hi=Math.max(ds[0],ds[1]);
    if(best.some(x=>x.path[0].d===hi))best=best.filter(x=>x.path[0].d===hi);
  }
  return best;
}
const nextMoves=()=>dice.length?seqs(S,turn,dice).map(x=>x.path[0]):[];
const pips=(s,p)=>{let t=s.bar[pi(p)]*25;for(let i=0;i<24;i++)if(s.b[i]*p>0)t+=Math.abs(s.b[i])*(p===1?i+1:24-i);return t;};
const name=p=>mode==='ai'?(p===1?'شما':'کامپیوتر'):mode==='online'?(p===my?'شما':'دوستت'):(p===1?'سفید':'سیاه');

function checkWin(){
  for(const p of[1,-1]){
    const k=pi(p);
    if(S.off[k]===15){
      over=true;const lo=pi(-p);let pts=1;
      if(S.off[lo]===0){
        pts=2;const inH=i=>p===1?i<=5:i>=18;
        if(S.bar[lo]>0||S.b.some((c,i)=>c*(-p)>0&&inH(i)))pts=3;
      }
      msg='🏆 '+name(p)+' برنده شد! ('+['','برد ساده: ۱ امتیاز','گمون: ۲ امتیاز','بک‌گمون: ۳ امتیاز'][pts]+')';
    }
  }
}

/* ---------- flow ---------- */
function init(a,b,fromNet){
  gid++;S=newState();over=false;busy=false;sel=null;hist=[];wait=false;
  if(!a){do{a=rd();b=rd();}while(a===b);}
  turn=a>b?1:-1;dice=[a,b];shown=[a,b];
  msg='تاس اول: '+name(turn)+' شروع می‌کند';
  if(mode==='online'&&!fromNet)send({t:'start',a,b});
  after();
}
function rollFor(a=rd(),b=rd(),fromNet){
  shown=a===b?[a,a,a,a]:[a,b];dice=shown.slice();hist=[];sel=null;msg='';
  if(mode==='online'&&!fromNet)send({t:'roll',a,b});
  after();
}
const aiTurn=()=>mode==='ai'&&turn===-1;
function after(){
  render();
  if(over)return;
  if(dice.length){
    if(!seqs(S,turn,dice).length){
      busy=true;msg='حرکتی ممکن نیست؛ نوبت رد می‌شود';render();
      later(()=>{busy=false;endTurn();},1400);
    }else if(aiTurn())aiPlay();
  }else if(aiTurn()){
    busy=true;render();
    later(()=>{busy=false;rollFor();},700);
  }
}
function endTurn(){turn=-turn;dice=[];shown=[];hist=[];sel=null;msg='';after();}
function doMove(m,fromNet){
  if(mode==='online'&&!fromNet)send({t:'move',m});
  hist.push({S:clone(S),dice:dice.slice()});
  apply(S,turn,m);dice.splice(dice.indexOf(m.d),1);sel=null;
  checkWin();
  if(over){render();return;}
  if(!dice.length){busy=true;render();later(()=>{busy=false;endTurn();},500);}
  else after();
}
function click(v){
  if(over||busy||!dice.length||!mine())return;
  if(sel!==null){
    const m=NM.filter(m=>m.f===sel&&m.t===v).sort((a,b)=>a.d-b.d)[0];
    if(m){doMove(m);return;}
  }
  sel=NM.some(m=>m.f===v)?v:null;
  render();
}

/* ---------- online ---------- */
function send(o){try{if(conn&&conn.open)conn.send(o);}catch(e){}}
function link(){return APP_LINK?APP_LINK+'?startapp='+code:location.origin+location.pathname+'?room='+code;}
function closeNet(){try{if(peer)peer.destroy();}catch(e){}peer=null;conn=null;}
function blank(){gid++;S=newState();turn=1;dice=[];shown=[];hist=[];over=false;busy=false;sel=null;msg='';}
function wire(){
  conn.on('data',d=>{
    wait=false;
    if(d.t==='start')init(d.a,d.b,true);
    else if(d.t==='roll')rollFor(d.a,d.b,true);
    else if(d.t==='move')doMove(d.m,true);
  });
  conn.on('close',()=>{if(!over){msg='ارتباط با دوستت قطع شد';busy=true;render();}});
}
function hostRoom(){
  closeNet();blank();my=1;wait=true;
  code=Array.from({length:6},()=>'abcdefghjkmnpqrstuvwxyz23456789'[Math.floor(Math.random()*31)]).join('');
  $('room').hidden=false;$('rmsg').textContent='در حال ساخت اتاق…';
  peer=new Peer('tnard-'+code);
  peer.on('open',()=>{$('rmsg').textContent='دعوت‌نامه رو برای دوستت بفرست. وقتی وارد شد بازی شروع می‌شه.';});
  peer.on('connection',c=>{
    conn=c;wire();
    c.on('open',()=>{$('room').hidden=true;init();});
  });
  peer.on('error',e=>{if(e.type==='unavailable-id')hostRoom();else{$('rmsg').textContent='خطا در اتصال ('+e.type+'). دوباره امتحان کن.';}});
  render();
}
function joinRoom(c){
  mode='online';$('mode').value='online';my=-1;code=c;wait=true;blank();
  msg='در حال اتصال به دوستت…';render();
  peer=new Peer();
  peer.on('open',()=>{
    conn=peer.connect('tnard-'+c,{reliable:true});wire();
    later(()=>{if(wait){msg='اتصال برقرار نشد. مطمئن شو دوستت بازی رو باز گذاشته و لینک رو دوباره بزن.';render();}},15000);
  });
  peer.on('error',e=>{msg='خطا در اتصال ('+e.type+')';render();});
}

/* ---------- computer player ---------- */
function evalS(s){
  let v=0;
  for(let i=0;i<24;i++){
    const c=-s.b[i];
    if(c===1){
      v-=4;
      let hit=s.bar[0]>0&&i>=18;
      for(let j=i+1;j<24&&!hit;j++)if(s.b[j]>0&&j-i<=12)hit=true;
      if(hit)v-=5;
    }else if(c>=2)v+=3+(i>=18?2:0)+(i>=12?1:0);
  }
  v+=12*s.bar[0]-12*s.bar[1]+14*s.off[1]+(pips(s,1)-pips(s,-1))*0.4;
  return v;
}
function aiPlay(){
  busy=true;render();
  const all=seqs(S,-1,dice);let best=all[0],bv=-1e9;
  for(const x of all){const v=evalS(x.st)+Math.random()*1.5;if(v>bv){bv=v;best=x;}}
  best.path.forEach((m,i)=>later(()=>{
    apply(S,-1,m);dice.splice(dice.indexOf(m.d),1);checkWin();render();
    if(i===best.path.length-1&&!over)later(()=>{busy=false;endTurn();},600);
  },(i+1)*700));
}

/* ---------- drawing ---------- */
function xOf(i){
  if(i>=6&&i<=11)return X0+(11-i)*PW;
  if(i<=5)return X1+(5-i)*PW;
  if(i<=17)return X0+(i-12)*PW;
  return X1+(i-18)*PW;
}
function tri(i){
  const x=xOf(i);
  return i>=12?`${x},10 ${x+PW},10 ${x+PW/2},200`:`${x},420 ${x+PW},420 ${x+PW/2},230`;
}
function chk(x,y,r,p,hl){
  return `<circle cx="${x}" cy="${y}" r="${r}" fill="${p===1?'#efe6d0':'#241c18'}" stroke="${hl?'#ffd400':p===1?'#9a8c70':'#000'}" stroke-width="${hl?4:2}"/>`+
         `<circle cx="${x}" cy="${y}" r="${r-6}" fill="none" stroke="${p===1?'#cbbd9c':'#4a3b33'}" stroke-width="1.5"/>`;
}
function render(){
  NM=(mine()&&dice.length&&!busy&&!over)?nextMoves():[];
  const dests=new Set(NM.filter(m=>sel!==null&&m.f===sel).map(m=>m.t));
  const srcs=new Set(NM.map(m=>m.f));
  let g='<rect width="704" height="430" rx="12" fill="#3b2416"/>'+
        '<rect x="14" y="10" width="288" height="410" fill="#1f6f78"/><rect x="346" y="10" width="288" height="410" fill="#1f6f78"/>'+
        '<rect x="302" y="10" width="44" height="410" fill="#2a190e"/><rect x="642" y="10" width="56" height="410" fill="#2a190e"/>';
  for(let i=0;i<24;i++)g+=`<polygon points="${tri(i)}" fill="${i%2?'#e8d9b0':'#9c2f2a'}"/>`;
  for(const t of dests){
    if(t==='off')g+=`<rect x="644" y="${turn===1?232:12}" width="52" height="186" fill="#ffd400" fill-opacity=".35" stroke="#ffd400" stroke-width="3"/>`;
    else g+=`<polygon points="${tri(t)}" fill="#ffd400" fill-opacity=".55"/>`;
  }
  for(let i=0;i<24;i++){
    const c=Math.abs(S.b[i]);if(!c)continue;
    const p=S.b[i]>0?1:-1,x=xOf(i)+PW/2,tp=i>=12,sp=Math.min(44,148/Math.max(1,c-1));
    for(let k=0;k<c;k++){
      const y=tp?31+k*sp:399-k*sp,top=k===c-1;
      g+=chk(x,y,21,p,top&&(sel===i||(sel===null&&srcs.has(i))));
      if(top&&c>5)g+=`<text x="${x}" y="${y}" dy=".35em" text-anchor="middle" font-size="16" font-weight="bold" fill="${p===1?'#222':'#eee'}">${c}</text>`;
    }
  }
  for(const p of[1,-1]){
    const n=S.bar[pi(p)];
    for(let k=0;k<n;k++){
      const y=p===1?260+k*26:170-k*26;
      g+=chk(324,y,18,p,k===n-1&&p===turn&&(sel==='bar'||(sel===null&&srcs.has('bar'))));
    }
    for(let k=0;k<S.off[pi(p)];k++){
      const y=p===1?409-k*11:12+k*11;
      g+=`<rect x="650" y="${y}" width="40" height="9" rx="2" fill="${p===1?'#efe6d0':'#241c18'}" stroke="${p===1?'#9a8c70':'#000'}"/>`;
    }
  }
  for(let i=0;i<24;i++){
    const x=xOf(i),y=i>=12?10:230;
    g+=`<rect data-i="${i}" x="${x}" y="${y}" width="${PW}" height="190" fill="#000" fill-opacity="0"/>`;
  }
  g+='<rect data-i="bar" x="302" y="10" width="44" height="410" fill="#000" fill-opacity="0"/>'+
     '<rect data-i="off" x="642" y="10" width="56" height="190" fill="#000" fill-opacity="0"/>'+
     '<rect data-i="off" x="642" y="230" width="56" height="190" fill="#000" fill-opacity="0"/>';
  $('bd').innerHTML=g;

  const usedN=shown.length-dice.length;
  $('dice').innerHTML=shown.map((d,i)=>`<span class="${i<usedN?'u':''}">${FACE[d-1]}</span>`).join('');
  $('st').textContent=msg||(over?'':wait?'منتظر اتصال…':'نوبت: '+name(turn)+(mine()&&!dice.length?' — تاس بنداز':busy?' …':''));
  $('roll').disabled=!(mine()&&!dice.length&&!over&&!busy);
  $('undo').disabled=!(mine()&&hist.length&&!over&&!busy&&mode!=='online');
  $('new').disabled=mode==='online'&&my!==1;
  $('info').textContent=`${name(1)}: ${pips(S,1)} پیپ، ${S.off[0]} خارج‌شده  |  ${name(-1)}: ${pips(S,-1)} پیپ، ${S.off[1]} خارج‌شده`;
}

/* ---------- events ---------- */
$('bd').addEventListener('click',e=>{
  const v=e.target.dataset&&e.target.dataset.i;
  if(v===undefined)return;
  click(v==='bar'||v==='off'?v:+v);
});
$('roll').onclick=()=>{if(!busy&&!over&&!dice.length)rollFor();};
$('undo').onclick=()=>{
  if(!hist.length||busy)return;
  const h=hist.pop();S=h.S;dice=h.dice;sel=null;msg='';render();
};
$('new').onclick=()=>{if(mode==='online'){if(my===1&&conn&&conn.open)init();}else init();};
$('mode').onchange=e=>{
  mode=e.target.value;closeNet();wait=false;$('room').hidden=true;
  if(mode==='online')hostRoom();else init();
};
$('share').onclick=()=>{
  const u='https://t.me/share/url?url='+encodeURIComponent(link())+'&text='+encodeURIComponent('بیا تخته نرد بازی کنیم 🎲');
  if(tg&&tg.openTelegramLink)tg.openTelegramLink(u);else window.open(u,'_blank');
};
$('copy').onclick=()=>{
  try{navigator.clipboard.writeText(link());$('copy').textContent='کپی شد ✓';}catch(e){prompt('لینک:',link());}
};
const sp=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param;
const room=sp||new URLSearchParams(location.search).get('room');
if(room&&/^[a-z0-9]{6}$/.test(room))joinRoom(room);else init();
</script>
</body>
</html>
