<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>بازی‌ها</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--saffron:#e0a526;--ivory:#efe6d0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#17110c;color:var(--ivory);font-family:Tahoma,Arial,sans-serif;user-select:none}
#app{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:14px;background:radial-gradient(ellipse at 50% 30%,#3a2a1c 0%,#17110c 70%)}
h1{margin:0;font-size:26px;letter-spacing:.5px}
#cards{display:flex;gap:18px;width:100%;justify-content:center;height:58%;max-height:230px}
.card{flex:1;max-width:240px;height:100%;border-radius:22px;border:1px solid rgba(255,255,255,.22);color:var(--ivory);font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;text-align:center;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.45);transition:transform .12s}
.card:active{transform:scale(.96)}
.card .ic{font-size:54px;line-height:1}
.card .t{font-size:22px;font-weight:bold}
.card .d{font-size:13px;opacity:.85;line-height:1.7}
#c1{background:linear-gradient(160deg,#6b3d1f,#2f1b0d)}
#c2{background:linear-gradient(160deg,#1f6b45,#0e2e1d)}
#c3{background:linear-gradient(160deg,#3b4fb8,#141c4d)}
#rot{background:none;border:0;color:var(--ivory);opacity:.6;font-size:13px;font-family:inherit;padding:6px}
</style>
</head>
<body>
<div id="app">
  <h1>🎮 بازی‌ها</h1>
  <div id="cards">
    <button class="card" id="c1" data-go="backgammon.html?from=lobby"><span class="ic">🎲</span><span class="t">تخته نرد</span><span class="d">با کامپیوتر، دو نفره<br>یا آنلاین با دوست</span></button>
    <button class="card" id="c2" data-go="hokm.html?from=lobby"><span class="ic">🃏</span><span class="t">حکم</span><span class="d">۱ تا ۴ نفره<br>جای خالی با کامپیوتر</span></button>
    <button class="card" id="c3" data-go="mench.html?from=lobby"><span class="ic">🎯</span><span class="t">منچ</span><span class="d">۱ تا ۴ نفره<br>جای خالی با کامپیوتر</span></button>
  </div>
  <button id="rot">🔄 صفحه برعکسه؟ اینجا بزن</button>
</div>
<script>
const tg=window.Telegram&&window.Telegram.WebApp;
if(tg){try{tg.ready();tg.expand();if(tg.disableVerticalSwipes)tg.disableVerticalSwipes();}catch(e){}}
const $=id=>document.getElementById(id);
let rot=1;try{rot=localStorage.getItem('rotDir')==='-1'?-1:1;}catch(e){}
function fit(){
  const w=innerWidth,h=innerHeight,a=$('app').style;
  a.cssText=h>w?(rot===1?`position:fixed;top:0;left:${w}px;width:${h}px;height:${w}px;transform-origin:0 0;transform:rotate(90deg)`
                        :`position:fixed;top:${h}px;left:0;width:${h}px;height:${w}px;transform-origin:0 0;transform:rotate(-90deg)`)
               :'position:fixed;top:0;left:0;width:100%;height:100%';
}
function flipScreen(){rot=-rot;try{localStorage.setItem('rotDir',rot);}catch(e){}fit();}
addEventListener('resize',fit);fit();
$('rot').onclick=flipScreen;
// لینک دعوت دوست (کد اتاق) مستقیم میره توی تخته نرد؛ ولی وقتی از داخل بازی برگشتی (back=1) همین‌جا می‌مونه
const sp=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param;
if(sp&&/^[0-2][a-z0-9]{5}$/.test(sp)&&new URLSearchParams(location.search).get('back')!=='1')location.replace('backgammon.html?room='+sp);
document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{location.href=c.dataset.go;});
</script>
</body>
</html>
